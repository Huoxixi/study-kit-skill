/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"style","record":"R27","category":"作者教材","label":"《动手学深度学习》13.12 · 内容与风格","url":"https://zh.d2l.ai/chapter_computer-vision/neural-style.html"}],"relatedQuestions":["CQ-K061"]},{"id":"K062","domain":"语音处理","unit":"语音处理基础","point":"基本概念（响度、共振峰、掩蔽效应、基音等）","level":"理解","page":4,"title":"语音的基础概念","summary":"响度、基音和共振峰描述不同的语音性质。","concept":"响度是对声音强弱的主观感受；基频是准周期浊音的基本重复频率，基音对应基频成分，影响音高感受。共振峰反映声道共振造成的谱峰。听觉掩蔽指一个声音使另一个声音不易听见；清音等信号不一定有清晰基频。","example":"地铁进站时，你会觉得朋友的话听不清，可能是噪声产生掩蔽；同一句话大声说和小声说，响度不同，不代表说话内容变了。","pitfall":"响度不等于频率；基频和共振峰也不能当作同一个量。","topic":"speech","domainId":"d08","kind":"syllabus","conceptSources":[{"key":"phonetics","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第15章 语音与特征","url":"https://web.stanford.edu/~jurafsky/slp3/15.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"phonetics","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第15章 语音与特征","url":"https://web.stanford.edu/~jurafsky/slp3/15.pdf"}],"relatedQuestions":["CQ-K062"]},{"id":"K063","domain":"语音处理","unit":"语音处理基础","point":"声音信号预处理与量化","level":"理解","page":4,"title":"语音采样、量化与预处理","summary":"采样离散时间，量化离散幅值。","concept":"采样按时间间隔取得信号数值，采样率是每秒样本数；量化把幅值映射到有限等级，位深影响可表示的等级数。语音预处理还可包含分帧、加窗和降噪等步骤。","example":"手机录音若采用 16 kHz，表示每秒取 16000 个样本；16 位则说明每个样本的数值表示位数。一个管时间，一个管幅值精度。","pitfall":"采样率和位深不是一回事；降噪也可能损伤语音成分。","topic":"speech","domainId":"d08","kind":"syllabus","conceptSources":[{"key":"phonetics","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第15章 语音与特征","url":"https://web.stanford.edu/~jurafsky/slp3/15.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"phonetics","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第15章 语音与特征","url":"https://web.stanford.edu/~jurafsky/slp3/15.pdf"}],"relatedQuestions":["CQ-K063"]},{"id":"K064","domain":"语音处理","unit":"语音处理基础","point":"常用时域、频域、声学特征","level":"理解","page":4,"title":"时域、频域特征与 MFCC","summary":"时域看随时间变化，频域看频率成分。","concept":"时域常用短时能量、过零率等特征；频域通过频谱描述各频率成分，能量、基频和谱包络等反映不同性质。MFCC 通常经短时功率谱、梅尔滤波、取对数和离散余弦变换得到，用较少系数概括谱形状，是常用声学特征。","example":"你说一声“你好”，录音是一串波形数值。提取 MFCC 后，每一小段声音变成一组特征数字，供后续语音模型处理。","pitfall":"MFCC 是声学特征，不是词向量、像素值或句法树；它也不是语音识别出的文字。","topic":"speech","domainId":"d08","kind":"syllabus","conceptSources":[{"key":"phonetics","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第15章 语音与特征","url":"https://web.stanford.edu/~jurafsky/slp3/15.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"phonetics","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第15章 语音与特征","url":"https://web.stanford.edu/~jurafsky/slp3/15.pdf"}],"relatedQuestions":["OC01","CQ-K064"]},{"id":"K065","domain":"语音处理","unit":"语音处理方法与应用","point":"常用模型（DNN-HMM、Attention、Transformer等）","level":"知道","page":4,"title":"语音建模方法","summary":"声学模型把声音特征与语言单位联系起来。","concept":"传统语音识别可用 HMM 表示状态序列，用 DNN 等估计与声学状态相关的信息；端到端方法可直接学习声音到文本等输出的映射。注意力和 Transformer 是可采用的建模机制。","example":"对手机说“明天见”，模型要把随时间变化的声音与相应文字联系起来。不同人说得快慢不同，模型还要处理这种时间差异。","pitfall":"离线识别得准，不代表实时识别一定来得及；准确率和延迟要分别看。","topic":"speech","domainId":"d08","kind":"syllabus","conceptSources":[{"key":"asr","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第16章 自动语音识别","url":"https://web.stanford.edu/~jurafsky/slp3/16.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"asr","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第16章 自动语音识别","url":"https://web.stanford.edu/~jurafsky/slp3/16.pdf"}],"relatedQuestions":["CQ-K065"]},{"id":"K066","domain":"语音处理","unit":"语音处理方法与应用","point":"语音识别（说话人、关键词、认证、增强）","level":"知道","page":4,"title":"语音识别相关任务","summary":"语音识别和说话人识别的目标不同。","concept":"自动语音识别 ASR 将语音转换为文字；说话人识别或验证处理“谁在说”；关键词检测查找指定词语；语音增强改善语音中噪声等干扰。这些任务可以组合使用。","example":"把语音消息转成文字，是在识别“说了什么”；用声音核验是不是本人，是在判断“谁说的”。","pitfall":"识别出文字，并不表示已经知道说话人的身份。","topic":"speech","domainId":"d08","kind":"syllabus","conceptSources":[{"key":"asr","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第16章 自动语音识别","url":"https://web.stanford.edu/~jurafsky/slp3/16.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"asr","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第16章 自动语音识别","url":"https://web.stanford.edu/~jurafsky/slp3/16.pdf"}],"relatedQuestions":["CQ-K066"]},{"id":"K067","domain":"语音处理","unit":"语音处理方法与应用","point":"语音合成（如文本到语音）","level":"知道","page":4,"title":"文本转语音 TTS","summary":"TTS 把文本转换为语音。","concept":"文本转语音 TTS 根据文字生成可听的语音，通常涉及文本分析、发音和声学或波形生成等处理。常用评价关注可懂度、自然度和韵律等。","example":"导航把“前方右转”读出来，就是 TTS。你说“前方右转”，手机把它记成文字，则是 ASR。","pitfall":"TTS 的主要输出是声音；ASR 的主要输出是文字，方向相反。","topic":"speech","domainId":"d08","kind":"syllabus","conceptSources":[{"key":"tts","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第17章 文本转语音","url":"https://web.stanford.edu/~jurafsky/slp3/17.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"tts","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第17章 文本转语音","url":"https://web.stanford.edu/~jurafsky/slp3/17.pdf"}],"relatedQuestions":["CQ-K067"]},{"id":"K068","domain":"自然语言处理","unit":"自然语言处理基础","point":"词法（分词、词性标注、命名实体识别等）","level":"理解","page":5,"title":"分词、词性与实体识别","summary":"分词、词性标注和实体识别处理不同标签。","concept":"分词确定词语边界；词性标注为词语标记名词、动词等类别；命名实体识别找出人名、地名、机构名等文本片段并分类。实体边界可能跨越多个词。","example":"“小王去上海”可以切成“小王／去／上海”。词性标注可把“去”标为动词，把另外两个词标为专有名词或相应细类；实体识别则把“小王”标为人名、“上海”标为地点。词性体系可能不同，但不能把这两类任务混为一谈。","pitfall":"词性标签和实体类别不同；不是所有名词都是命名实体。","topic":"speech","domainId":"d09","kind":"syllabus","conceptSources":[{"key":"words","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第2章 词与 token","url":"https://web.stanford.edu/~jurafsky/slp3/2.pdf"},{"key":"tagging","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第18章 词性与实体识别","url":"https://web.stanford.edu/~jurafsky/slp3/18.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"words","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第2章 词与 token","url":"https://web.stanford.edu/~jurafsky/slp3/2.pdf"},{"key":"tagging","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第18章 词性与实体识别","url":"https://web.stanford.edu/~jurafsky/slp3/18.pdf"}],"relatedQuestions":["OM04","CQ-K068","QA-05"]},{"id":"K069","domain":"自然语言处理","unit":"自然语言处理基础","point":"句法（句子成分分析、生成式句法、依存式句法等）","level":"理解","page":5,"title":"句法分析","summary":"句法分析描述句子的结构关系。","concept":"句子成分分析区分主语、谓语、宾语等；成分句法按短语层次组织句子，生成式句法可用文法规则描述结构，如 S→NP VP；依存句法表示词间支配关系。文法生成结构与大模型生成一段文字不是同一个概念。","example":"“小王帮小李”和“小李帮小王”用了同样的词，谁帮助谁却反过来了。只统计词出现了几次，分不清这个差别。","pitfall":"词相同不代表句子结构和意思相同。","topic":"speech","domainId":"d09","kind":"syllabus","conceptSources":[{"key":"syntax","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第19章 成分句法","url":"https://web.stanford.edu/~jurafsky/slp3/19.pdf"},{"key":"dependency","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第20章 依存句法","url":"https://web.stanford.edu/~jurafsky/slp3/20.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"syntax","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第19章 成分句法","url":"https://web.stanford.edu/~jurafsky/slp3/19.pdf"},{"key":"dependency","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第20章 依存句法","url":"https://web.stanford.edu/~jurafsky/slp3/20.pdf"}],"relatedQuestions":["CQ-K069"]},{"id":"K070","domain":"自然语言处理","unit":"自然语言处理方法与应用","point":"词表示（n-gram语言模型、word2vec等）","level":"知道","page":5,"title":"n-gram 与 Word2Vec","summary":"n-gram 利用有限上下文，Word2Vec 学习词向量。","concept":"n-gram 语言模型用前 n−1 个词近似预测后词概率。Word2Vec 中，CBOW 由周围词预测中心词，Skip-gram 由中心词预测周围词，从而学习稠密词向量。普通静态词向量对同一词表项使用固定表示，不随所在句子改变。","example":"输入法在“我想喝”后推荐“水”或“茶”，可帮助理解按前文预测后词；“杯子”和“水杯”的用法相近，词向量也可能较接近。","pitfall":"普通 Word2Vec 不会因为这次句子不同，就自动为同一词表项换一个上下文向量。","topic":"speech","domainId":"d09","kind":"syllabus","conceptSources":[{"key":"ngram","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第3章 n-gram","url":"https://web.stanford.edu/~jurafsky/slp3/3.pdf"},{"key":"embedding","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第5章 词嵌入","url":"https://web.stanford.edu/~jurafsky/slp3/5.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"ngram","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第3章 n-gram","url":"https://web.stanford.edu/~jurafsky/slp3/3.pdf"},{"key":"embedding","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第5章 词嵌入","url":"https://web.stanford.edu/~jurafsky/slp3/5.pdf"}],"relatedQuestions":["OC10","CQ-K070"]},{"id":"K071","domain":"自然语言处理","unit":"自然语言处理方法与应用","point":"句子建模（RNN、LSTM、Transformer等）","level":"知道","page":5,"title":"句子与上下文建模","summary":"上下文模型结合词序和前后文表示句子。","concept":"句子表示需要综合词语及其关系。RNN 及其门控变体 LSTM 顺序传递状态，Transformer 用注意力关联位置；上下文词表示可随句子变化。上下文窗口限定可处理的 token 范围，不保证每处信息都被同样有效利用。","example":"“苹果很好吃”和“苹果发布了新手机”中的“苹果”意思不同。上下文模型可以利用周围词来区分这两种用法。","pitfall":"窗口大只说明能放下更多输入，不保证每一处信息都被正确使用。","topic":"speech","domainId":"d09","kind":"syllabus","conceptSources":[{"key":"rnn","record":"R27","category":"作者教材","label":"《动手学深度学习》8.4 · 循环神经网络","url":"https://zh.d2l.ai/chapter_recurrent-neural-networks/rnn.html"},{"key":"pretrain","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第7章 Transformer 与预训练","url":"https://web.stanford.edu/~jurafsky/slp3/7.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"rnn","record":"R27","category":"作者教材","label":"《动手学深度学习》8.4 · 循环神经网络","url":"https://zh.d2l.ai/chapter_recurrent-neural-networks/rnn.html"},{"key":"pretrain","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第7章 Transformer 与预训练","url":"https://web.stanford.edu/~jurafsky/slp3/7.pdf"}],"relatedQuestions":["OC02","CQ-K071"]},{"id":"K072","domain":"自然语言处理","unit":"自然语言处理方法与应用","point":"垂直任务类（机器翻译、问答系统、信息抽取等）","level":"知道","page":5,"title":"翻译、问答与信息抽取","summary":"翻译、问答和信息抽取是不同的语言任务。","concept":"机器翻译将一种语言的内容转换为另一种语言；问答针对问题提供答案；信息抽取从文本中识别实体、关系、事件或字段，形成结构化结果。","example":"通知写“周五下午三点在图书馆集合”。提取成“时间：周五 15:00；地点：图书馆”，就是信息抽取；问“几点集合”再作答，是问答。","pitfall":"句子通顺不代表事实正确；抽取出的日期和地点仍要与原文对应。","topic":"speech","domainId":"d09","kind":"syllabus","conceptSources":[{"key":"translation","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第13章 机器翻译","url":"https://web.stanford.edu/~jurafsky/slp3/13.pdf"},{"key":"extraction","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第21章 信息抽取","url":"https://web.stanford.edu/~jurafsky/slp3/21.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"translation","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第13章 机器翻译","url":"https://web.stanford.edu/~jurafsky/slp3/13.pdf"},{"key":"extraction","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第21章 信息抽取","url":"https://web.stanford.edu/~jurafsky/slp3/21.pdf"}],"relatedQuestions":["CQ-K072"]},{"id":"K073","domain":"人工智能前沿技术与生成式大模型","unit":"数据增强技术","point":"扩散模型基础","level":"知道","page":5,"title":"扩散模型","summary":"扩散模型通过学习反向去噪生成数据。","concept":"扩散模型的前向过程逐步向数据加噪，训练反向模型学习去噪；生成时通常从噪声出发，逐步得到样本。条件扩散还可利用文字等信息控制生成。","example":"输入“桌上的一碗面”，模型可从随机噪声逐步生成符合描述的图片。过程中越来越像一张图，不是到网上找到原图再贴回来。","pitfall":"这与给已有模糊照片简单加锐化不同；生成结果也不保证符合现实事实。","topic":"model","domainId":"d10","kind":"syllabus","conceptSources":[{"key":"ddpm","record":"R36","category":"原始论文","label":"Ho 等 2020 · DDPM，§2–3","url":"https://arxiv.org/abs/2006.11239v2"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"ddpm","record":"R36","category":"原始论文","label":"Ho 等 2020 · DDPM，§2–3","url":"https://arxiv.org/abs/2006.11239v2"}],"relatedQuestions":["OM06","CQ-K073"]},{"id":"K074","domain":"人工智能前沿技术与生成式大模型","unit":"数据增强技术","point":"生成对抗网络（GAN）基础","level":"知道","page":5,"title":"生成对抗网络 GAN","summary":"GAN 由生成器和判别器对抗训练。","concept":"生成对抗网络中，生成器从噪声等输入产生样本，判别器区分真实数据与生成样本；两者通过对抗目标共同训练。训练可能出现不稳定和模式崩溃。","example":"假设用 GAN 做猫头像：生成器产出一张新图，判别器比较真实训练图片与生成图，区分它们的来源；两者据训练目标更新。判别器并不是在判断“现实中是否存在这只猫”。","pitfall":"判别器判断的是所学分布下的真假区分，不是新闻事实核查。","topic":"model","domainId":"d10","kind":"syllabus","conceptSources":[{"key":"gan","record":"R37","category":"原始论文","label":"Goodfellow 等 2014 · GAN","url":"https://arxiv.org/abs/1406.2661v1"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"gan","record":"R37","category":"原始论文","label":"Goodfellow 等 2014 · GAN","url":"https://arxiv.org/abs/1406.2661v1"}],"relatedQuestions":["OM06","CQ-K074"]},{"id":"K075","domain":"人工智能前沿技术与生成式大模型","unit":"多模态技术","point":"多模态基础（感知、数据）","level":"知道","page":5,"title":"多模态基础","summary":"模态是信息的表现类型。","concept":"文本、图像、音频和视频等属于不同模态。多模态系统处理或生成不止一种模态；跨模态对齐建立对应关系，融合综合多种信息。","example":"你拍下菜单，再问“鱼香肉丝多少钱”，系统要把文字问题与图片中的菜名、价格对应起来。菜单没有写配料时，不能仅凭图像就断定这道菜不含辣椒。","pitfall":"能接收图片，不代表能准确理解所有图表、单位和数字。","topic":"rag","domainId":"d10","kind":"syllabus","conceptSources":[{"key":"clip","record":"R43","category":"原始论文","label":"Radford 等 2021 · CLIP 图文配对学习","url":"https://arxiv.org/abs/2103.00020v1"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"clip","record":"R43","category":"原始论文","label":"Radford 等 2021 · CLIP 图文配对学习","url":"https://arxiv.org/abs/2103.00020v1"}],"relatedQuestions":["OP33B","CQ-K075","QA-12"]},{"id":"K076","domain":"人工智能前沿技术与生成式大模型","unit":"多模态技术","point":"多模态学习","level":"知道","page":5,"title":"多模态学习","summary":"多模态学习利用模态间的联系。","concept":"多模态学习研究不同模态的表示、对齐、融合及转换。配对图文可用于学习共同表示；对比学习可提高匹配图文的接近程度，并区分不匹配样本。","example":"假设相册用文本编码器和图像编码器，把“海边日落”与照片的视觉表示匹配，再返回已有照片，这是跨模态检索。若只是在搜人工写的文件名，则不能据此断定用了多模态学习。","pitfall":"多模态学习也可用于分类和检索，不等同于生成式模型。图文配错会干扰学习，增加模态也不保证每个任务都更好。","topic":"rag","domainId":"d10","kind":"syllabus","conceptSources":[{"key":"clip","record":"R43","category":"原始论文","label":"Radford 等 2021 · CLIP 图文配对学习","url":"https://arxiv.org/abs/2103.00020v1"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"clip","record":"R43","category":"原始论文","label":"Radford 等 2021 · CLIP 图文配对学习","url":"https://arxiv.org/abs/2103.00020v1"}],"relatedQuestions":["OM06","CQ-K076","QA-12"]},{"id":"K077","domain":"人工智能前沿技术与生成式大模型","unit":"分布式机器学习与联邦学习","point":"分布式机器学习基础","level":"知道","page":5,"title":"分布式机器学习","summary":"分布式训练让多个计算节点共同训练模型。","concept":"分布式训练将数据或模型计算分配给多个进程、设备或机器，通过通信协作。数据并行常同步梯度，模型并行切分模型，流水线并行按计算阶段组织执行。","example":"一批水果照片分给几台机器处理，各自计算后交换所需的更新信息。不是各练各的、最后随便挑一个结果就叫协同训练。","pitfall":"分布式训练可以先集中数据，再分给不同节点计算；联邦学习强调参与方保留本地原始数据。两者不能直接等同，通信也会占时间。","topic":"model","domainId":"d10","kind":"syllabus","conceptSources":[{"key":"distributed","record":"R46","category":"官方技术文档","label":"TensorFlow · Multi-worker training 与同步","url":"https://www.tensorflow.org/tutorials/distribute/multi_worker_with_keras"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"distributed","record":"R46","category":"官方技术文档","label":"TensorFlow · Multi-worker training 与同步","url":"https://www.tensorflow.org/tutorials/distribute/multi_worker_with_keras"}],"relatedQuestions":["CQ-K077"]},{"id":"K078","domain":"人工智能前沿技术与生成式大模型","unit":"分布式机器学习与联邦学习","point":"联邦学习基础","level":"知道","page":5,"title":"联邦学习","summary":"联邦学习在分散数据上协作训练。","concept":"联邦学习让参与方保留本地原始训练数据，通过交换模型更新等信息协作学习，通常由聚合机制形成共享模型。它减少原始数据的集中收集，但更新仍可能泄漏信息。","example":"手机打字时，输入法会推荐后面的词。一种可采用的改进办法是：手机用本地输入记录训练，只交换模型更新，由服务端汇总；这说明联邦学习的思路，不表示你用的输入法一定采用它。","pitfall":"不上传原始记录，不等于没有隐私风险；模型更新也可能泄漏信息。","topic":"model","domainId":"d10","kind":"syllabus","conceptSources":[{"key":"federated","record":"R38","category":"原始论文","label":"McMahan 等 · 联邦学习与本地更新聚合","url":"https://arxiv.org/abs/1602.05629v4"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"federated","record":"R38","category":"原始论文","label":"McMahan 等 · 联邦学习与本地更新聚合","url":"https://arxiv.org/abs/1602.05629v4"}],"relatedQuestions":["OT07","CQ-K078"]},{"id":"K079","domain":"人工智能前沿技术与生成式大模型","unit":"生成式大模型原理与技术","point":"预训练概念","level":"掌握","page":5,"title":"预训练","summary":"预训练为后续任务学习可迁移的参数。","concept":"预训练先在较大数据上用相应目标训练模型，再用于下游任务。语言模型常用预测下一个 token 或恢复被遮蔽内容等自监督目标；预训练与后续微调的数据和目标可以不同。","example":"同样是写班级通知，模型可先用大量文本训练下一 token 预测，再用“要求—通知范文”示范做微调。前者是预训练，后者是后续训练；这不表示模型会自动看到学校今天新发的通知。","pitfall":"参数多不代表知道最新通知，也不能保证记住的事实都正确。","topic":"model","domainId":"d10","kind":"syllabus","conceptSources":[{"key":"pretrain","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第7章 Transformer 与预训练","url":"https://web.stanford.edu/~jurafsky/slp3/7.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"pretrain","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第7章 Transformer 与预训练","url":"https://web.stanford.edu/~jurafsky/slp3/7.pdf"}],"relatedQuestions":["OT05","CQ-K079"]},{"id":"K080","domain":"人工智能前沿技术与生成式大模型","unit":"生成式大模型原理与技术","point":"检索增强生成（RAG）概念","level":"掌握","page":5,"title":"检索增强生成","summary":"RAG 将检索结果作为生成的补充上下文。","concept":"检索增强生成 RAG 将信息检索与生成模型结合：先从外部资料获取与问题相关的内容，再将内容与问题一起提供给生成模型。检索可采用关键词、向量或混合方法，不限定必须使用向量数据库。","example":"你问“这次考试几点开始”，系统可先找学校刚发的考试通知，再把相关原文交给模型。若通知明确写九点，回答就应依据九点并附出处；检索错了或模型没按原文答，仍会出错。","pitfall":"这里的“外部”指模型参数之外，包括单位内部文档，不限定互联网。常规 RAG 不更新模型权重，也不保证检索正确或回答完全忠实于资料。","topic":"rag","domainId":"d10","kind":"syllabus","flow":["检索资料","补充上下文","生成回答"],"conceptSources":[{"key":"rag","record":"R39","category":"官方技术文档","label":"Microsoft Learn · RAG 的检索与生成","url":"https://learn.microsoft.com/zh-cn/azure/search/retrieval-augmented-generation-overview"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"rag","record":"R39","category":"官方技术文档","label":"Microsoft Learn · RAG 的检索与生成","url":"https://learn.microsoft.com/zh-cn/azure/search/retrieval-augmented-generation-overview"}],"relatedQuestions":["Q-RAG","OC05","OC13","OM01","OT09","OT14","OP31A","CQ-K080"]},{"id":"K081","domain":"人工智能前沿技术与生成式大模型","unit":"生成式大模型原理与技术","point":"Transformer架构相关模型","level":"掌握","page":5,"title":"Transformer 的模型结构","summary":"Transformer 可采用不同的整体结构。","concept":"编码器结构生成输入表示；仅解码器结构常按自回归方式预测后续 token；编码器—解码器结构根据输入序列生成输出序列。原始 Transformer 使用编码器—解码器，BERT 和 GPT 分别代表其他常见路线。","example":"翻译“明天见”时，编码器—解码器可以先表示输入，再生成另一语言；聊天续写常用仅解码器模型逐步生成。","pitfall":"不是所有 Transformer 都同时具备编码器和解码器；结构名称也不是效果排名。","topic":"model","domainId":"d10","kind":"syllabus","conceptSources":[{"key":"transformer","record":"R27","category":"作者教材","label":"《动手学深度学习》10.7 · Transformer","url":"https://zh.d2l.ai/chapter_attention-mechanisms/transformer.html"},{"key":"pretrain","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第7章 Transformer 与预训练","url":"https://web.stanford.edu/~jurafsky/slp3/7.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"transformer","record":"R27","category":"作者教材","label":"《动手学深度学习》10.7 · Transformer","url":"https://zh.d2l.ai/chapter_attention-mechanisms/transformer.html"},{"key":"pretrain","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第7章 Transformer 与预训练","url":"https://web.stanford.edu/~jurafsky/slp3/7.pdf"}],"relatedQuestions":["OM05","CQ-K081"]},{"id":"K082","domain":"人工智能前沿技术与生成式大模型","unit":"生成式大模型原理与技术","point":"深度学习框架技术和使用","level":"掌握","page":5,"title":"深度学习框架与训练循环","summary":"训练循环把前向、求梯度和更新串起来。","concept":"PyTorch 常见训练循环依次执行清零梯度、前向计算、计算损失、反向传播和优化器更新。model.train()、model.eval() 切换部分模块的训练或评估行为；no_grad() 等单独控制梯度记录。","example":"训练认水果模型时，每读一小批照片，就算一次预测和损失，再按梯度更新。评估时改用评估模式，检查没参与训练的照片。","pitfall":"model.eval() 不会自动关闭梯度记录；loss.backward() 也不会自动执行参数更新。","topic":"model","domainId":"d10","kind":"syllabus","conceptSources":[{"key":"pytorch","record":"R07","category":"官方技术文档","label":"PyTorch · 训练循环、梯度与优化器","url":"https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial"},{"key":"autograd","record":"R60","category":"官方技术文档","label":"PyTorch 2.15 · eval 与梯度模式的区别","url":"https://docs.pytorch.org/docs/2.15/notes/autograd.html#locally-disabling-gradient-computation"},{"key":"accumulate","record":"R60","category":"官方技术文档","label":"PyTorch 2.15 · 多个 batch 的梯度累积","url":"https://docs.pytorch.org/docs/2.15/notes/amp_examples.html#gradient-accumulation"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"pytorch","record":"R07","category":"官方技术文档","label":"PyTorch · 训练循环、梯度与优化器","url":"https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial"},{"key":"autograd","record":"R60","category":"官方技术文档","label":"PyTorch 2.15 · eval 与梯度模式的区别","url":"https://docs.pytorch.org/docs/2.15/notes/autograd.html#locally-disabling-gradient-computation"},{"key":"accumulate","record":"R60","category":"官方技术文档","label":"PyTorch 2.15 · 多个 batch 的梯度累积","url":"https://docs.pytorch.org/docs/2.15/notes/amp_examples.html#gradient-accumulation"}],"relatedQuestions":["OB4","CQ-K082","QA-04"]},{"id":"K083","domain":"人工智能前沿技术与生成式大模型","unit":"生成式大模型原理与技术","point":"RLHF等数据预处理技术","level":"掌握","page":5,"title":"RLHF 与奖励模型","summary":"RLHF 利用人类偏好信号优化模型行为。","concept":"基于人类反馈的强化学习 RLHF 将人类评价转为优化信号。InstructGPT 论文的流程是：用示范进行监督微调 SFT；用回答排序训练奖励模型 RM；再用 PPO 优化策略，并用相应约束限制偏离。","example":"同样问“怎么煮面”，标注者比较几个回答，偏好步骤清楚、没有乱编的回答。这些比较可用于训练奖励模型，但偏好分高也不表示每句话都经过事实核查。","pitfall":"考纲把 RLHF 列在“数据预处理”相关条目，学习时要知道它是反馈训练与对齐方法，不只是清洗数据。这是 InstructGPT 的具体流程，不是所有对齐都必须用 PPO；奖励模型也不是事实裁判。","topic":"model","domainId":"d10","kind":"syllabus","aliases":"人类反馈强化学习 SFT RM PPO 奖励模型","conceptSources":[{"key":"rlhf","record":"R12","category":"原始论文","label":"Ouyang 等 2022 · InstructGPT，Figure 2 / §3.1","url":"https://arxiv.org/abs/2203.02155v1"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"rlhf","record":"R12","category":"原始论文","label":"Ouyang 等 2022 · InstructGPT，Figure 2 / §3.1","url":"https://arxiv.org/abs/2203.02155v1"}],"relatedQuestions":["OB3","CQ-K083"]},{"id":"K084","domain":"人工智能前沿技术与生成式大模型","unit":"生成式大模型原理与技术","point":"模型预训练、模型微调、模型对齐、超参数调整等训练技术","level":"掌握","page":5,"title":"预训练、微调、对齐与超参数","summary":"预训练、微调、对齐与超参数调整各有作用。","concept":"预训练学习通用参数；微调在其基础上用任务或指令数据继续训练。全参数微调通常更新基础模型全部可训练权重；PEFT 仅更新少量参数或引入适配参数。对齐关注行为目标。学习率、batch 大小、训练轮数是超参数，由训练配置给定；模型权重通常由训练学习。生成温度等推理设置又是另一类配置。","example":"想让模型把班级通知固定整理成“时间、地点、事项”，可以用这类示范做微调；想知道刚更新的考试时间，则通常需要提供新资料。","pitfall":"微调既可调整格式，也可学习任务知识，但不保证事实全面、及时。RAG 与微调可组合；LoRA 是参数高效方法，不等于不用训练数据。","topic":"model","domainId":"d10","kind":"syllabus","conceptSources":[{"key":"peft","record":"R21","category":"官方技术文档","label":"Hugging Face PEFT · LoRA 与参数高效适配","url":"https://huggingface.co/docs/peft/main/package_reference/lora"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"peft","record":"R21","category":"官方技术文档","label":"Hugging Face PEFT · LoRA 与参数高效适配","url":"https://huggingface.co/docs/peft/main/package_reference/lora"}],"relatedQuestions":["OM02","CQ-K084","QA-08"]},{"id":"K085","domain":"人工智能前沿技术与生成式大模型","unit":"生成式大模型原理与技术","point":"大模型推理部署技术","level":"掌握","page":5,"title":"大模型推理部署","summary":"推理是用已训练模型计算输出。","concept":"语言模型推理通常先预填充输入，再逐步解码输出 token。部署把模型放入可用环境或服务。批处理、缓存、量化和调度解决不同问题；量化用较低精度表示权重或部分计算，可能节省资源，也可能损失质量，具体收益需验证。","example":"你在聊天框发一句话，先等第一段回答出现，再看文字继续出来。前一段等待和后续生成速度不是同一个指标。","pitfall":"吞吐高表示单位时间处理量大，不保证每个人都等得更短。","topic":"serving","domainId":"d10","kind":"syllabus","conceptSources":[{"key":"pretrain","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第7章 Transformer 与预训练","url":"https://web.stanford.edu/~jurafsky/slp3/7.pdf"},{"key":"metrics","record":"R08","category":"官方技术文档","label":"vLLM · 指标计量口径","url":"https://docs.vllm.ai/en/latest/design/metrics/"},{"key":"vllm","record":"R08","category":"官方技术文档","label":"vLLM · 模型服务与调度","url":"https://docs.vllm.ai/en/stable/"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"pretrain","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第7章 Transformer 与预训练","url":"https://web.stanford.edu/~jurafsky/slp3/7.pdf"},{"key":"metrics","record":"R08","category":"官方技术文档","label":"vLLM · 指标计量口径","url":"https://docs.vllm.ai/en/latest/design/metrics/"},{"key":"vllm","record":"R08","category":"官方技术文档","label":"vLLM · 模型服务与调度","url":"https://docs.vllm.ai/en/stable/"}],"relatedQuestions":["OC06","OC07","OP23","CQ-K085"]},{"id":"K086","domain":"人工智能前沿技术与生成式大模型","unit":"生成式大模型原理与技术","point":"异构计算、分布式和并行计算等工具链&Infra技术","level":"知道","page":5,"title":"工具链与基础设施","summary":"基础设施为模型运行提供环境和资源。","concept":"模型基础设施包括计算设备、驱动和运行时、通信、存储、容器、任务调度与监控等。工具链连接数据处理、训练、部署和维护环节；组件需满足硬件和版本兼容条件。","example":"像手机软件需要对应系统版本，模型运行也要匹配驱动、框架和设备。软件各自能打开，并不代表放在一起就一定能配合。","pitfall":"组件支持某种功能，不等于任意版本组合都支持。","topic":"serving","domainId":"d10","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K086"]},{"id":"K087","domain":"人工智能前沿技术与生成式大模型","unit":"智能体与具身智能","point":"智能体基础","level":"知道","page":5,"title":"智能体 Agent","summary":"智能体感知环境并选择行动。","concept":"智能体通过传感或输入获得环境信息，通过动作影响环境。理性智能体根据已有观察和知识，选择使预期性能指标最大化的动作。大模型智能体可把检索和工具调用作为动作，但实际执行还需要权限校验及终止条件。","example":"你让助手查“明天要不要带伞”，它先调用天气工具，再根据返回结果回答。若工具查不到，应说明没查到，不能一直反复调用。","pitfall":"会多轮聊天不自动等于能可靠执行任务；工具调用也需要校验参数与权限。","topic":"agent","domainId":"d10","kind":"syllabus","conceptSources":[{"key":"react","record":"R16","category":"原始论文","label":"Yao 等 2022 · ReAct","url":"https://arxiv.org/abs/2210.03629v3"},{"key":"agent","record":"R47","category":"作者教材","label":"Russell 与 Norvig · AIMA 第2章，智能体与理性","url":"https://aima.cs.berkeley.edu/4th-ed/pdfs/newchap02.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"react","record":"R16","category":"原始论文","label":"Yao 等 2022 · ReAct","url":"https://arxiv.org/abs/2210.03629v3"},{"key":"agent","record":"R47","category":"作者教材","label":"Russell 与 Norvig · AIMA 第2章，智能体与理性","url":"https://aima.cs.berkeley.edu/4th-ed/pdfs/newchap02.pdf"}],"relatedQuestions":["OC03","OT01","OP33A","CQ-K087"]},{"id":"K088","domain":"人工智能前沿技术与生成式大模型","unit":"智能体与具身智能","point":"具身智能基础","level":"知道","page":5,"title":"具身智能","summary":"具身智能通过身体与环境交互。","concept":"具身智能强调智能体的感知、认知和行动与身体及环境相联系。机器人等实体系统通过传感器获取信息，经决策和控制驱动执行器，再接收行动产生的反馈。","example":"扫地机器人碰到椅子腿，会重新判断位置、调整路线继续清扫。它不只是在说“前面有障碍”，还要真的控制轮子。","pitfall":"能说出怎么走，不代表能安全控制设备走过去。","topic":"agent","domainId":"d10","kind":"syllabus","conceptSources":[{"key":"agent","record":"R47","category":"作者教材","label":"Russell 与 Norvig · AIMA 第2章，智能体与理性","url":"https://aima.cs.berkeley.edu/4th-ed/pdfs/newchap02.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 5 页","url":"41/41.pdf#page=5"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"agent","record":"R47","category":"作者教材","label":"Russell 与 Norvig · AIMA 第2章，智能体与理性","url":"https://aima.cs.berkeley.edu/4th-ed/pdfs/newchap02.pdf"}],"sourceNote":"AIMA 用于感知、行动与环境的结构说明，不作为具身智能的统一定义。","relatedQuestions":["CQ-K088"]},{"id":"K089","domain":"人工智能赋能千行百业","unit":"智能社会","point":"智能社会概念、技术、应用","level":"理解","page":6,"title":"智能社会","summary":"智能社会是考纲中的应用领域。","concept":"AI 在社会生活和公共服务中可用于信息处理、服务匹配与辅助决策等。它是应用范围的归纳，不是一种独立算法或已有统一技术结构的模型。","example":"向社区服务平台问“办这件事需要带什么材料”，系统根据办事指南整理清单，是公共服务中的问答应用。","pitfall":"模型建议不等于正式决定，也不能因此免除人工责任或取消适当的复核与申诉渠道。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K089"]},{"id":"K090","domain":"人工智能赋能千行百业","unit":"智能社会领域模型","point":"语料、模型算法与算力支持","level":"知道","page":6,"title":"智能社会：数据与资源","summary":"社会应用中的数据、模型与算力各有作用。","concept":"社会应用的支撑可分三类：数据提供政策、文本和服务记录等信息；模型执行分类、检索或生成；算力支持训练与运行。数据的时间范围和访问权限影响可用性。","example":"查公交卡办理地点时，旧网点名单可能已经过期。即使模型很大、机器很快，拿到旧名单也可能答错。","pitfall":"公开页面和内部记录的权限不同，不能因为都能存进系统就一并给所有人查看。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K090"]},{"id":"K091","domain":"人工智能赋能千行百业","unit":"智能社会领域模型实例","point":"新闻、社会治理、法律等","level":"知道","page":6,"title":"新闻、治理与法律应用","summary":"新闻、社会治理和法律是具体应用方向。","concept":"这些领域的 AI 应用包括新闻摘要、诉求分类、法律文本检索与辅助分析。新闻事实、规则版本和适用条件需要分别核对；生成和检索不能直接等同于专业裁决。","example":"小区公告更新了停车办法，系统可以找出新旧差别。你要确认的仍是正式公告内容和生效日期。","pitfall":"附上链接不代表摘要一定忠实，链接中的旧规定也不一定适用于现在。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K091"]},{"id":"K092","domain":"人工智能赋能千行百业","unit":"智能交通","point":"智能交通概念、技术、应用","level":"理解","page":6,"title":"智能交通","summary":"智能交通利用信息技术处理交通问题。","concept":"考纲涉及交通感知、预测、规划和控制等任务，包括路况识别、流量预测、路径规划与信号调度。不同任务使用的输入和输出不同。","example":"地图估计半小时后哪条路会堵，是预测；据此推荐绕行路线，是规划。仅把“当前前方堵车”显示出来，主要是当前状态信息，不能一概叫预测；按车流调整红绿灯则是控制。","pitfall":"不能只看平均预测准确率，还要考虑实时性、异常天气和失效情况。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K092"]},{"id":"K093","domain":"人工智能赋能千行百业","unit":"智能交通领域模型","point":"语料、模型算法与算力支持","level":"知道","page":6,"title":"交通：数据与资源","summary":"交通数据带有明显的时间和空间信息。","concept":"交通数据包括摄像头、道路传感器、地图、定位和历史流量等。模型与算力支持这些数据的处理。多源数据使用时需要时间同步；端侧、路侧与云端计算承担的任务可能不同。","example":"地图上一处路口显示畅通，另一处显示拥堵，先要看是不是同一时间的数据。昨天的数据不能直接当作现在的路况。","pitfall":"传感器多不代表数据自动对齐；时间错位可能导致判断错误。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K093"]},{"id":"K094","domain":"人工智能赋能千行百业","unit":"智能交通领域模型实例","point":"自动驾驶、交通调度","level":"知道","page":6,"title":"自动驾驶与交通调度","summary":"自动驾驶和交通调度处理不同层级的任务。","concept":"自动驾驶围绕车辆的环境感知、定位、预测、规划和控制；交通调度围绕道路或交通网络的流量与资源协调。系统均需接收反馈，并处理异常。","example":"一辆车绕开前方障碍，是车辆层面的行为；让几个路口的绿灯配合起来，是更大范围的交通调度。","pitfall":"模拟环境里没出事故，不能单独证明开放道路上安全。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K094"]},{"id":"K095","domain":"人工智能赋能千行百业","unit":"智能医疗","point":"智能医疗概念、技术、应用","level":"理解","page":6,"title":"智能医疗","summary":"智能医疗是 AI 在医疗任务中的应用。","concept":"考纲涉及医疗信息处理、辅助诊断、健康服务等应用。图像分类、分割和文本处理是可用技术；具体系统的适用范围需要相应验证，模型输出与临床结论不是同一概念。","example":"医院里，系统可帮助医生先标出影像中需要关注的位置；医生还会结合原图、检查和病史判断。这里只说明工作分工。","pitfall":"在常见样本上表现好，不能自动推出在罕见样本或另一家医院也同样可靠。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["OM08","CQ-K095"]},{"id":"K096","domain":"人工智能赋能千行百业","unit":"智能医疗领域模型","point":"语料、模型算法与算力支持","level":"知道","page":6,"title":"医疗：数据与资源","summary":"医疗数据包括影像、文本和检验等类型。","concept":"医疗数据包括影像、病历文本和检验记录；模型可用于图像分类、分割和文本处理；算力支持训练与院内或设备端推理，需按任务时延和数据条件选择。人群分布和标注会影响效果，划分评估数据时应避免同一患者相关样本泄漏。","example":"把一张检查单用于学习前，不只是遮住姓名：编号、电话和其他可关联信息也可能识别到本人。","pitfall":"一次脱敏不代表永久没有重新识别风险。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K096"]},{"id":"K097","domain":"人工智能赋能千行百业","unit":"智能医疗领域模型实例","point":"AI看片，网上医生","level":"知道","page":6,"title":"医学影像与在线咨询","summary":"医学影像与在线咨询使用不同输入。","concept":"影像应用可处理图像分类、目标检测与分割；在线咨询应用主要处理用户描述、问答和资料检索。两者均应明确使用范围和人工复核安排，不能仅凭生成文字给出确定诊断。","example":"影像系统在图上标位置；咨询系统根据文字问题整理就医流程。前者不等于会问诊，后者也不等于看懂了原始影像。","pitfall":"通用聊天回答不能直接当作医生的确定诊断；不确定结果应有复核或转交办法。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K097"]},{"id":"K098","domain":"人工智能赋能千行百业","unit":"智能制造","point":"智能制造概念、技术、应用","level":"理解","page":6,"title":"智能制造","summary":"智能制造将数据与模型用于生产任务。","concept":"考纲涉及外观缺陷检测、设备状态预测、工艺优化和生产调度等应用。视觉模型、时序模型和优化方法分别处理不同问题，不存在一个算法覆盖所有制造任务。","example":"饮料瓶经过摄像头时，系统检查瓶盖有没有歪；这属于视觉检测。根据设备振动预测要不要检修，则是另一类任务。","pitfall":"准确率之外，还要看漏掉缺陷的代价、处理速度和生产安全。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["OC04","CQ-K098"]},{"id":"K099","domain":"人工智能赋能千行百业","unit":"智能制造领域模型","point":"语料、模型算法与算力支持","level":"知道","page":6,"title":"制造：数据与资源","summary":"制造数据反映设备和生产条件。","concept":"制造数据包括图像、传感器、工艺参数和维护记录；模型可做缺陷检测、状态预测或排产优化；算力可用于离线训练和产线实时推理。更换相机、材料或工艺可能改变分布，旧评估不一定继续适用。","example":"检测面包包装的相机换了位置，光线和角度都变了。模型以前认得准，换完后也要重新检查。","pitfall":"旧产线的好成绩不能直接套到所有新产线。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K099"]},{"id":"K100","domain":"人工智能赋能千行百业","unit":"智能制造领域模型实例","point":"无人AI工厂","level":"知道","page":6,"title":"无人化工厂","summary":"无人化指相应生产环节自动运行。","concept":"无人化工厂涉及自动感知、设备控制、机器人、任务调度和维护。无人化通常针对规定条件下的环节，不表示没有设计、维护、管理和异常接管人员。","example":"固定程序装盒、封口属于自动化，单凭这些动作不能证明用了 AI。若再用图像模型识别包装缺陷并辅助分拣，就是其中的 AI 环节；卡住或出现异常时仍可能需要人员接管。","pitfall":"“无人”不是所有场景都能自动处理的保证。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K100"]},{"id":"K101","domain":"人工智能赋能千行百业","unit":"智能创意","point":"智能创意概念、技术、应用","level":"理解","page":6,"title":"智能创意","summary":"智能创意用 AI 辅助内容创作。","concept":"考纲中的智能创意包括文字、图像、音频和视频等生成与编辑。生成模型根据数据中学到的模式及输入条件产生内容；创意评价还包括是否符合要求和能否使用。","example":"给生日聚会做邀请卡，先让模型出几种构图，再自己改日期、名字和文字大小，就是常见的辅助创作。","pitfall":"看起来精美，不代表文字无误或素材权利问题已经解决。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K101"]},{"id":"K102","domain":"人工智能赋能千行百业","unit":"智能创意领域模型","point":"语料、模型算法与算力支持","level":"知道","page":6,"title":"创意：数据与资源","summary":"创意应用需要匹配内容类型与资源。","concept":"创意数据可包括经授权的文本、图片、音乐和视频；相应生成模型学习各类内容的表示与生成规律；算力承担训练及生成计算，需求受模型、分辨率、时长和并发等影响。素材能否使用还要看授权条件。","example":"生成一张邀请卡和生成一段一分钟视频，输出量和计算量不同；不能只看都是“生成”就按同一成本估算。","pitfall":"提高分辨率不保证事实、文字或动作逻辑正确；网上能看到的素材，也不自动等于可任意用于训练或发布。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K102"]},{"id":"K103","domain":"人工智能赋能千行百业","unit":"智能创意领域模型实例","point":"数字人、AI编剧、AI视频制作、AI作画、AI音乐等","level":"知道","page":6,"title":"数字人、图像与音视频生成","summary":"数字人、图像和音视频生成属于不同任务。","concept":"考纲列举数字人、AI 编剧、视频制作、作画和音乐。编剧处理文字叙事，作画生成静态图像，音乐生成处理音高、节奏等，视频还涉及时间一致性；数字人可组合形象、语音和交互。它们并非都由同一种固定算法实现。","example":"让卡通讲解员读一段活动介绍，要配合形象和声音；只生成一张海报，则不需要连续动作。","pitfall":"合成声音或画面不能当作本人真实说过、做过的证据。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K103"]},{"id":"K104","domain":"人工智能赋能千行百业","unit":"智能推荐","point":"智能推荐概念、技术、应用","level":"理解","page":6,"title":"智能推荐","summary":"推荐系统从候选中选择用户可能感兴趣的项目。","concept":"推荐系统利用用户、项目和交互信息估计相关性或偏好。内容推荐利用项目特征，协同过滤利用交互模式。关键词搜索主要接收显式查询，推荐也可利用上下文和历史行为；二者可在同一系统中组合，不是互斥技术。","example":"你常看做饭视频，软件可能继续推菜谱；你主动搜“番茄炒蛋”，则是搜索。两者有联系，但任务不完全一样。","pitfall":"推荐不是只找“最热门”；点击也不一定代表真正满意。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[{"key":"recommend","record":"R55","category":"官方技术教程","label":"Google Developers · 内容推荐与协同过滤","url":"https://developers.google.com/machine-learning/recommendation/overview/candidate-generation"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"recommend","record":"R55","category":"官方技术教程","label":"Google Developers · 内容推荐与协同过滤","url":"https://developers.google.com/machine-learning/recommendation/overview/candidate-generation"}],"relatedQuestions":["CQ-K104"]},{"id":"K105","domain":"人工智能赋能千行百业","unit":"智能推荐领域模型","point":"语料、模型算法与算力支持","level":"知道","page":6,"title":"推荐：数据、模型与算力","summary":"推荐依赖交互数据、推荐模型与运行资源。","concept":"数据包括项目内容、点击、购买或评分等；模型可用内容匹配、协同过滤或组合方法；算力用于训练、候选检索和排序。新用户或新项目交互不足称为冷启动，可用内容、用户明确选择等补充；交互只是偏好的代理。","example":"刚装一个视频软件，它还不知道你喜欢什么，可能先让你选“运动、做饭、音乐”。这能帮助应对新用户冷启动。","pitfall":"没点过不等于不喜欢；曝光少也会造成交互少。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[{"key":"coldstart","record":"R55","category":"官方技术教程","label":"Google Developers · 协同过滤与冷启动","url":"https://developers.google.com/machine-learning/recommendation/collaborative/summary"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"coldstart","record":"R55","category":"官方技术教程","label":"Google Developers · 协同过滤与冷启动","url":"https://developers.google.com/machine-learning/recommendation/collaborative/summary"}],"relatedQuestions":["CQ-K105"]},{"id":"K106","domain":"人工智能赋能千行百业","unit":"智能推荐领域模型实例","point":"网上购物、短推荐视频","level":"知道","page":6,"title":"购物与视频推荐","summary":"购物和视频推荐的对象及反馈不同。","concept":"购物推荐可利用浏览、收藏、购买等反馈；视频推荐可利用观看、停留、完播等反馈。反馈只是偏好的代理，目标和评价需按任务确定。","example":"买过一次冰箱后，你未必还想天天买冰箱；看完一个视频，也可能只是忘了划走。系统不能把一次行为直接当成永久喜好。","pitfall":"点击率或观看时长高，不必然表示用户受益更多。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K106"]},{"id":"K107","domain":"人工智能赋能千行百业","unit":"智慧教育","point":"智慧教育概念、技术、应用","level":"理解","page":6,"title":"智慧教育","summary":"智慧教育在教学和管理中使用智能技术。","concept":"考纲涉及智能助教、助学、助研和助管等应用。系统可用于整理资料、生成练习、提供反馈和辅助管理；教学目标、知识准确性和学生信息保护仍需分别考虑。","example":"做错分数加法后，系统给你一道相近题并解释分母为什么要统一，是助学的一种用法。","pitfall":"能给出答案不等于学生已经理解，也不代表答案一定正确。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["OC14","CQ-K107"]},{"id":"K108","domain":"人工智能赋能千行百业","unit":"智慧教育领域模型","point":"语料、模型算法与算力支持","level":"知道","page":6,"title":"教育：数据与资源","summary":"教育数据反映学习活动及其结果。","concept":"教育数据包括教材、题目、作答和课程记录；模型可做内容检索、练习反馈和学习辅助；算力支持训练、推理及多人使用。推断能力时应考虑题目难度和样本范围，不能仅凭一次分数给学生定性。","example":"只做对一道简单口算，不能说明已经掌握整章。若多次在通分题出错，才更有理由继续检查这个知识点。","pitfall":"一次分数不能完整代表能力；教育数据应按任务必要性和适当依据收集、使用，不能无限收集或随意向他人公开。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K108"]},{"id":"K109","domain":"人工智能赋能千行百业","unit":"智慧教育领域模型实例","point":"AI助教、AI助学、AI助研、AI助管","level":"知道","page":6,"title":"AI 助教、助学、助研与助管","summary":"助教、助学、助研和助管服务不同任务。","concept":"按考纲，助教辅助教师教学，助学辅助学生学习，助研辅助科研活动，助管辅助教育管理。具体系统可能重叠，区分时看主要使用者与任务。","example":"老师用系统出练习是助教；学生用系统查错题是助学；整理论文线索是助研；排教室是助管。","pitfall":"助研列出的文献题名、作者和链接仍需核验，不能因为排版像引用就相信。工具名称相同，也不代表每次都属于同一种教育应用。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 6 页","url":"41/41.pdf#page=6"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["OC14","CQ-K109"]},{"id":"K110","domain":"人工智能赋能千行百业","unit":"机器人","point":"机器人的概念、技术、应用","level":"理解","page":7,"title":"机器人基础","summary":"机器人通过可编程机构执行动作。","concept":"机器人是可编程的执行机构，具有一定程度自主性，用于移动、操作或定位等任务，通常结合机构、传感、控制和执行部分。它不必使用大模型或具有人形。行业统计口径与标准定义可能不同，不能把任意遥控装置都直接等同机器人。","example":"扫地机器人是机器人，工厂机械臂也是；电脑里的聊天窗口没有机械身体，不能仅因会说话就称作实体机器人。","pitfall":"有模型不等于有实体动作能力，机器人也不一定长得像人。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[{"key":"robot","record":"R59","category":"行业机构标准释义","label":"IFR · ISO 8373 的机器人自主性及设备边界","url":"https://ifr.org/service-robots"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"robot","record":"R59","category":"行业机构标准释义","label":"IFR · ISO 8373 的机器人自主性及设备边界","url":"https://ifr.org/service-robots"}],"sourceNote":"IFR 来源用于核对一定程度自主性及机器人设备边界；没有声称读取 ISO 标准付费全文。","relatedQuestions":["CQ-K110"]},{"id":"K111","domain":"人工智能赋能千行百业","unit":"机器人领域模型","point":"语料、模型算法与算力支持","level":"知道","page":7,"title":"机器人：数据与资源","summary":"机器人需要把感知与控制连接起来。","concept":"机器人数据可包括图像、深度、位置、力觉和动作轨迹；感知及决策模型处理这些输入，控制器驱动执行器并利用反馈调整。算力需兼顾模型运行和实时控制，训练资源与在线控制资源的要求不一定相同。","example":"机器人夹纸杯时，先判断杯子位置，再控制夹爪；夹得太紧会压坏，太松会掉，力反馈可帮助调整。","pitfall":"延迟过大可能导致动作不及时，不能只看语言回答是否流畅。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K111"]},{"id":"K112","domain":"人工智能赋能千行百业","unit":"机器人领域模型实例","point":"移动机器人（AMRs）、工业协作机器人（Cobots）、无人配送机器人、智能仓储机器人等","level":"知道","page":7,"title":"移动、协作与仓储机器人","summary":"不同机器人按任务选择运动与控制方式。","concept":"自主移动机器人 AMR 侧重定位、导航和避障；协作机器人 Cobot 面向相应的人机协作任务；无人配送和仓储机器人还涉及载荷、路径与任务调度。协作设计不等于所有环境中都可无条件安全接触。","example":"餐厅送餐机器人遇到有人挡路，可能绕行或停下等待；它不应只因为路线规划好了就继续往前走。","pitfall":"协作机器人仍需相应安全措施，“协作”不代表在任何环境都可任意接触。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K112"]},{"id":"K113","domain":"人工智能赋能千行百业","unit":"智能驱动科学研究","point":"AI4Science概念、技术、应用","level":"理解","page":7,"title":"AI4Science","summary":"AI4Science 将 AI 用于科学研究。","concept":"AI4Science 关注用学习方法支持预测、模拟、候选筛选和实验设计等科学任务。模型输出可形成研究线索，是否成立仍需独立计算、实验或其他适当方法验证。","example":"假设研究团队用 AI 根据历史天气记录预测明天下不下雨，再与之后观测比较，这是科学预测研究的一种例子。手机显示天气本身不能证明用了 AI；传统数值天气预报也能提供预报。","pitfall":"模型分数高不等于科学结论已经证实。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["OT12","CQ-K113"]},{"id":"K114","domain":"人工智能赋能千行百业","unit":"科学研究领域模型","point":"语料、模型算法与算力支持","level":"知道","page":7,"title":"科研：数据与验证","summary":"科研模型要说明数据范围和验证条件。","concept":"科学数据可来自观测、实验或模拟；模型可结合学习方法与领域约束；算力支持训练、模拟和大规模预测。测量误差、数据覆盖及相关样本泄漏影响评估，新条件下的外推结论需额外验证。","example":"用春天的气温记录学预测，不能只凭春天测试得准，就认为冬天也一定准。季节变化可能超出原先数据范围。","pitfall":"随机划分的好成绩，不能证明任意新条件下都有效。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K114"]},{"id":"K115","domain":"人工智能赋能千行百业","unit":"科学研究领域模型实例","point":"AIfor*量子物理与量子化学、AIfor*生物制药与蛋白质结构分析、AIfor*新材料研发、AIfor*核聚变与前沿物理、AIfor*气候预测与地球模拟、AIfor*合成生物学、AIfor*分子相互作用","level":"知道","page":7,"title":"AI 驱动的科学应用","summary":"不同科学应用有不同的验证方法。","concept":"考纲列举量子物理与量子化学、生物制药与蛋白质结构、新材料、核聚变与前沿物理、气候预测与地球模拟、合成生物学、分子相互作用。模型可做预测、模拟、筛选或辅助控制；不同任务需要相应验证，不能把一个预测当作另一个领域的结论。","example":"手机天气软件预测“明天下雨”，要用天气观测来核对；模型预测一种新材料耐热，则需相应材料测试。不能只说“AI 预测了”就算验证完成。","pitfall":"预测蛋白质结构不等于已经证明药物有效、安全或获准使用。","topic":"industry","domainId":"d11","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K115"]},{"id":"K116","domain":"从业能力","unit":"学习能力","point":"论文阅读能力","level":"理解","page":7,"title":"论文阅读能力","summary":"论文阅读需要区分方法、结果和局限。","concept":"阅读时应确认问题、方法、数据、评价指标和实验条件，分清作者报告的结果与自己推断的结论。","example":"读一篇“某方法更准”的文章，先看它测了哪些题、和谁比较。只在十道题上更准，不能顺口说成“任何题都更准”。","pitfall":"摘要中的一句结论有适用范围，不能把未阅读或未验证的效果补进去。","topic":"foundation","domainId":"d12","kind":"syllabus","conceptSources":[{"key":"rlhf","record":"R12","category":"原始论文","label":"Ouyang 等 2022 · InstructGPT，Figure 2 / §3.1","url":"https://arxiv.org/abs/2203.02155v1"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"rlhf","record":"R12","category":"原始论文","label":"Ouyang 等 2022 · InstructGPT，Figure 2 / §3.1","url":"https://arxiv.org/abs/2203.02155v1"}],"relatedQuestions":["OB3","CQ-K116"]},{"id":"K117","domain":"从业能力","unit":"学习能力","point":"项目规划和实践能力","level":"理解","page":7,"title":"项目规划和实践能力","summary":"项目规划把需求转成可执行的安排。","concept":"项目规划包括明确任务与使用者，安排数据、方法、资源和实现步骤，并确定测试及验收方式。计划与已完成、已验证的结果应分开。","example":"要做“查课表”小工具，先说清楚读哪份课表、问什么、怎么核对；只列一串热门软件名字，还没说明工具能不能用。","pitfall":"架构图和组件清单不是验收结果，还要处理查不到、资料过期等情况。","topic":"foundation","domainId":"d12","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K117"]},{"id":"K118","domain":"人工智能安全与伦理","unit":"可信人工智能","point":"可信人工智能的可解释性、安全性、公正性、隐私性","level":"理解","page":7,"title":"可信人工智能","summary":"可信 AI 包含多个不同维度。","concept":"NIST AI RMF 将可信特征概括为有效且可靠、运行安全（safe）、信息安全与韧性（secure and resilient）、可问责且透明、可解释与可理解、隐私增强，以及管理有害偏差的公平性等。不同维度需要分别评价，也可能需要权衡。","example":"手机相册认人很准，并不能说明照片不会泄漏。“认得准”和“保护隐私”要分别检查。","pitfall":"高准确率不能单独证明公平、安全或隐私保护达标。","topic":"ethics","domainId":"d13","kind":"syllabus","conceptSources":[{"key":"nist","record":"R40","category":"技术框架","label":"NIST AI RMF 1.0 · §3 可信特征与全生命周期管理","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"nist","record":"R40","category":"技术框架","label":"NIST AI RMF 1.0 · §3 可信特征与全生命周期管理","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}],"relatedQuestions":["OM07","OM08","OP13","CQ-K118"]},{"id":"K119","domain":"人工智能安全与伦理","unit":"人工智能伦理","point":"人工智能的伦理基础和安全挑战","level":"理解","page":7,"title":"伦理与安全挑战","summary":"AI 风险取决于系统及其使用环境。","concept":"考纲涉及偏差、隐私、安全、滥用和责任等挑战。风险分析需要考虑谁可能受到影响、错误可能造成什么后果，以及出现问题后能否发现和处理。","example":"模型把一张猫照片认错，和把一条重要通知的日期写错，后果不同。影响更大的输出，通常更需要复核。","pitfall":"写一句“仅供参考”不能代替限制、检查和纠错安排。","topic":"ethics","domainId":"d13","kind":"syllabus","conceptSources":[{"key":"nist","record":"R40","category":"技术框架","label":"NIST AI RMF 1.0 · §3 可信特征与全生命周期管理","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"nist","record":"R40","category":"技术框架","label":"NIST AI RMF 1.0 · §3 可信特征与全生命周期管理","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"}],"relatedQuestions":["OB5","OP33B","CQ-K119"]},{"id":"K120","domain":"人工智能安全与伦理","unit":"人工智能伦理","point":"人工智能伦理原则","level":"知道","page":7,"title":"人工智能伦理原则","summary":"伦理原则包括公平、透明、隐私和问责等要求。","concept":"我国《新一代人工智能伦理规范》提出增进人类福祉、促进公平公正、保护隐私安全、确保可控可信、强化责任担当和提升伦理素养六项基本伦理要求，并对不同活动提出规范。","example":"班级用系统分配活动名额时，应说明规则，检查是否对某些同学不公平，并让分错的人有机会提出复核。","pitfall":"口头说“公平”不等于已经公平，还需要具体规则与检查。","topic":"ethics","domainId":"d13","kind":"syllabus","conceptSources":[{"key":"ethics","record":"R41","category":"政府发布规范","label":"科技部 ·《新一代人工智能伦理规范》第三条等","url":"https://www.most.gov.cn/kjbgz/202109/t20210926_177063.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"ethics","record":"R41","category":"政府发布规范","label":"科技部 ·《新一代人工智能伦理规范》第三条等","url":"https://www.most.gov.cn/kjbgz/202109/t20210926_177063.html"}],"relatedQuestions":["CQ-K120"]},{"id":"K121","domain":"人工智能安全与伦理","unit":"人工智能伦理","point":"构建负责任的人工智能系统","level":"知道","page":7,"title":"负责任的 AI 系统","summary":"负责任的 AI 实践覆盖系统全生命周期。","concept":"负责任实践将伦理和风险要求落实到设计、开发、部署、使用与维护中，包括明确责任、适当人工监督、记录、评估和问题处置。监测结果可用于修正系统或停止不合适的使用。","example":"课表助手把考试时间答错后，应更正资料、提醒受影响的人，并查清为什么用到了旧课表，而不只是让它重新说一遍。","pitfall":"一次测试通过不代表一直可靠，资料和使用环境变化后仍需检查。","topic":"ethics","domainId":"d13","kind":"syllabus","conceptSources":[{"key":"nist","record":"R40","category":"技术框架","label":"NIST AI RMF 1.0 · §3 可信特征与全生命周期管理","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"key":"ethics","record":"R41","category":"政府发布规范","label":"科技部 ·《新一代人工智能伦理规范》第三条等","url":"https://www.most.gov.cn/kjbgz/202109/t20210926_177063.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 7 页","url":"41/41.pdf#page=7"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"nist","record":"R40","category":"技术框架","label":"NIST AI RMF 1.0 · §3 可信特征与全生命周期管理","url":"https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf"},{"key":"ethics","record":"R41","category":"政府发布规范","label":"科技部 ·《新一代人工智能伦理规范》第三条等","url":"https://www.most.gov.cn/kjbgz/202109/t20210926_177063.html"}],"relatedQuestions":["OM07","OP13","CQ-K121"]},{"id":"S01","title":"长上下文、标度规律与涌现","point":"长上下文、标度规律与涌现","unit":"样卷细拆考点","level":"补充","page":5,"summary":"三项研究分别讨论位置、训练规模和评价现象。","concept":"Lost in the Middle 研究部分模型利用长上下文中不同位置的信息；Chinchilla 研究给定训练算力下参数量与训练 token 的配置；涌现研究指出，一些表面突跃与不连续指标有关。三者不是同一个结论。","example":"让同一模型查一份很长的班级通知，分别把集合时间放在开头、中间、结尾，再比较回答。这个测试只检查这份材料和这个模型，不能推到所有模型。","pitfall":"上下文位置利用弱不等于内容一定被截断；特定研究不能当作所有当前模型的永久规律。","topic":"model","domainId":"d10","domain":"人工智能前沿技术与生成式大模型","kind":"supplement","conceptSources":[{"key":"middle","record":"R13","category":"原始论文","label":"Lost in the Middle · 长上下文位置实验","url":"https://arxiv.org/abs/2307.03172"},{"key":"chinchilla","record":"R14","category":"原始论文","label":"Chinchilla · 固定训练算力下的规模配置","url":"https://arxiv.org/abs/2203.15556"},{"key":"emergent","record":"R15","category":"原始论文","label":"涌现与不连续评价指标研究","url":"https://arxiv.org/abs/2304.15004"}],"conceptKind":"definition","scopeSources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"}],"sources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"},{"key":"middle","record":"R13","category":"原始论文","label":"Lost in the Middle · 长上下文位置实验","url":"https://arxiv.org/abs/2307.03172"},{"key":"chinchilla","record":"R14","category":"原始论文","label":"Chinchilla · 固定训练算力下的规模配置","url":"https://arxiv.org/abs/2203.15556"},{"key":"emergent","record":"R15","category":"原始论文","label":"涌现与不连续评价指标研究","url":"https://arxiv.org/abs/2304.15004"}],"relatedQuestions":["OC02","OT05","OT10","CQ-S01"]},{"id":"S02","title":"API 请求、鉴权与错误处理","point":"API 请求、鉴权与错误处理","unit":"样卷细拆考点","level":"补充","page":5,"summary":"API 是应用程序编程接口。","concept":"API 是程序接口的一种通称；本卡讨论 HTTP 接口。请求包括地址、方法、请求头及可选请求体，响应包括状态码与内容。400 表示服务器认为请求有语法、格式等问题；401 表示缺少有效认证凭据；429 表示一段时间内请求过多。字段和限额以具体接口为准。","example":"天气软件向服务发出“查上海明天天气”的请求，再把返回内容显示出来。像去窗口办事，请求要说清办什么，所需凭据也得有效。","pitfall":"不能把所有错误都当作参数格式错；密钥不要贴进截图，重试也不能无限进行。","topic":"model","domainId":"d10","domain":"人工智能前沿技术与生成式大模型","kind":"supplement","conceptSources":[{"key":"http","record":"R24","category":"官方技术文档","label":"MDN · HTTP 401 认证失败","url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/401"},{"key":"http400","record":"R24","category":"技术参考文档","label":"MDN · HTTP 400 Bad Request","url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/400"},{"key":"http429","record":"R24","category":"技术参考文档","label":"MDN · HTTP 429 Too Many Requests","url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/429"}],"conceptKind":"definition","scopeSources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"}],"sources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"},{"key":"http","record":"R24","category":"官方技术文档","label":"MDN · HTTP 401 认证失败","url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/401"},{"key":"http400","record":"R24","category":"技术参考文档","label":"MDN · HTTP 400 Bad Request","url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/400"},{"key":"http429","record":"R24","category":"技术参考文档","label":"MDN · HTTP 429 Too Many Requests","url":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status/429"}],"relatedQuestions":["OM09","OM10","OT13","OB5","CQ-S02"]},{"id":"S03","title":"参数高效微调 PEFT","point":"参数高效微调 PEFT","unit":"样卷细拆考点","level":"补充","page":5,"summary":"PEFT 只调整或引入较少可训练参数。","concept":"参数高效微调 PEFT 减少需要更新的参数。LoRA 冻结基础权重，学习低秩权重增量；Prefix Tuning 学习连续前缀表示；P-Tuning v2 使用深层提示方法。这些方法与全参数微调不同。","example":"想让模型把活动通知写成固定格式，可以用示范训练一小部分新增参数。像给已有工具加一个专用配件，但实际学的是参数，不是贴一句提示就结束。","pitfall":"参数少不等于不用数据，也不保证质量超过全参数微调。","topic":"model","domainId":"d10","domain":"人工智能前沿技术与生成式大模型","kind":"supplement","conceptSources":[{"key":"peft","record":"R21","category":"官方技术文档","label":"Hugging Face PEFT · LoRA 与参数高效适配","url":"https://huggingface.co/docs/peft/main/package_reference/lora"},{"key":"prefix","record":"R21","category":"官方技术文档","label":"Hugging Face PEFT · Prefix Tuning","url":"https://huggingface.co/docs/peft/main/en/package_reference/prefix_tuning"},{"key":"ptuning","record":"R52","category":"原始论文","label":"Liu 等 · P-Tuning v2，深层连续提示","url":"https://arxiv.org/abs/2110.07602v3"}],"conceptKind":"definition","scopeSources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"}],"sources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"},{"key":"peft","record":"R21","category":"官方技术文档","label":"Hugging Face PEFT · LoRA 与参数高效适配","url":"https://huggingface.co/docs/peft/main/package_reference/lora"},{"key":"prefix","record":"R21","category":"官方技术文档","label":"Hugging Face PEFT · Prefix Tuning","url":"https://huggingface.co/docs/peft/main/en/package_reference/prefix_tuning"},{"key":"ptuning","record":"R52","category":"原始论文","label":"Liu 等 · P-Tuning v2，深层连续提示","url":"https://arxiv.org/abs/2110.07602v3"}],"relatedQuestions":["OM02","CQ-S03"]},{"id":"S04","title":"文档切分与上下文保留","point":"文档切分与上下文保留","unit":"样卷细拆考点","level":"补充","page":5,"summary":"文档切分把长资料分成可检索的片段。","concept":"切分可按固定长度、标题、段落或语义边界进行。重叠使相邻片段共享部分内容；元数据保留标题、页码和版本等。片段大小与重叠需要结合文档结构和检索结果选择。","example":"一份学校通知分为“报名、考试、查成绩”。问报名截止日期时，先找报名段；别把“截止日期”切在一块、适用条件切到另一块，导致看半句就答错。","pitfall":"不是所有文档都适合同一长度或重叠比例；表头、单位和条件不能随意丢掉。","topic":"rag","domainId":"d10","domain":"人工智能前沿技术与生成式大模型","kind":"supplement","conceptSources":[{"key":"chunks","record":"R39","category":"官方技术文档","label":"Microsoft Learn · 文档切分","url":"https://learn.microsoft.com/zh-cn/azure/search/vector-search-how-to-chunk-documents"}],"conceptKind":"definition","scopeSources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"}],"sources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"},{"key":"chunks","record":"R39","category":"官方技术文档","label":"Microsoft Learn · 文档切分","url":"https://learn.microsoft.com/zh-cn/azure/search/vector-search-how-to-chunk-documents"}],"relatedQuestions":["Q-RAG","OT14","OP31A","CQ-S04"]},{"id":"S05","title":"Embedding、度量与元数据","point":"Embedding、度量与元数据","unit":"样卷细拆考点","level":"补充","page":5,"summary":"Embedding 把对象映射为向量表示。","concept":"嵌入模型将文本等对象编码为向量；检索用匹配的表示和度量比较接近程度。余弦相似度比较夹角；非零向量归一化为单位长度后，其内积等于余弦相似度。元数据可另外用于过滤。","example":"搜“手机没电了怎么办”时，向量检索可能找到“如何给手机充电”。词不完全相同，但语义可能接近；若只想看本校通知，还得加资料范围条件。","pitfall":"不能混用不匹配的嵌入模型或任意截断维度；也不是每种度量都要求手动归一化。","topic":"rag","domainId":"d10","domain":"人工智能前沿技术与生成式大模型","kind":"supplement","aliases":"向量相似度 嵌入模型 embedding cosine 内积 归一化","conceptSources":[{"key":"embedding","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第5章 词嵌入","url":"https://web.stanford.edu/~jurafsky/slp3/5.pdf"},{"key":"milvus","record":"R11","category":"官方技术文档","label":"Milvus 2.6 · 距离、内积与余弦","url":"https://milvus.io/docs/v2.6.x/metric.md"}],"conceptKind":"definition","scopeSources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"}],"sources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"},{"key":"embedding","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第5章 词嵌入","url":"https://web.stanford.edu/~jurafsky/slp3/5.pdf"},{"key":"milvus","record":"R11","category":"官方技术文档","label":"Milvus 2.6 · 距离、内积与余弦","url":"https://milvus.io/docs/v2.6.x/metric.md"}],"relatedQuestions":["OT14","OP31B","CQ-S05"]},{"id":"S06","title":"检索元数据与权限过滤","point":"检索元数据与权限过滤","unit":"样卷细拆考点","level":"补充","page":5,"summary":"元数据过滤限制可进入检索的资料范围。","concept":"元数据是描述资料的信息，如部门、文档类型、发布日期和访问控制信息。过滤根据条件保留候选；访问控制则由服务端根据身份强制执行，不能由用户在问题里自报身份来决定。","example":"同学查课表只能查学生可看的资料，老师内部会议记录即使内容相关，也不能一起返回。像图书馆里能搜到书名，不代表能打开任何受限文件。","pitfall":"只在提示词里写“不要泄密”不能实现权限控制；未经授权的片段也不应先送给模型再遮掉。","topic":"rag","domainId":"d10","domain":"人工智能前沿技术与生成式大模型","kind":"supplement","conceptSources":[{"key":"securityfilter","record":"R39","category":"官方技术文档","label":"Microsoft Learn · 身份与检索安全过滤","url":"https://learn.microsoft.com/en-us/azure/search/search-security-trimming-for-azure-search"}],"conceptKind":"definition","scopeSources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"}],"sources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"},{"key":"securityfilter","record":"R39","category":"官方技术文档","label":"Microsoft Learn · 身份与检索安全过滤","url":"https://learn.microsoft.com/en-us/azure/search/search-security-trimming-for-azure-search"}],"relatedQuestions":["OT09","OP12","OP31B","OP32B","CQ-S06"]},{"id":"S07","title":"混合检索与结果融合","point":"混合检索与结果融合","unit":"样卷细拆考点","level":"补充","page":5,"summary":"混合检索结合关键词与向量等检索方式。","concept":"关键词检索按词项匹配，向量检索按表示的接近程度匹配。混合检索合并两类结果；RRF 等方法根据排名融合，评分融合则需要处理不同分数尺度。","example":"查“G123 次列车”，准确车次很重要，关键词有用；查“能放折叠伞的小包”，描述可能有多种写法，语义检索也有用。","pitfall":"BM25 分数和向量分数不在同一尺度，不能不加说明就直接相加。","topic":"rag","domainId":"d10","domain":"人工智能前沿技术与生成式大模型","kind":"supplement","aliases":"混合检索 BM25 RRF","conceptSources":[{"key":"rrf","record":"R39","category":"官方技术文档","label":"Microsoft Learn · 混合结果与 RRF","url":"https://learn.microsoft.com/en-us/azure/search/hybrid-search-ranking"}],"conceptKind":"definition","scopeSources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"}],"sources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"},{"key":"rrf","record":"R39","category":"官方技术文档","label":"Microsoft Learn · 混合结果与 RRF","url":"https://learn.microsoft.com/en-us/azure/search/hybrid-search-ranking"}],"relatedQuestions":["OC05","OP32A","CQ-S07"]},{"id":"S08","title":"重排序与检索评估","point":"重排序与检索评估","unit":"样卷细拆考点","level":"补充","page":5,"summary":"重排序对已召回的候选重新评估相关性。","concept":"重排序对查询和已召回候选重新评分或排序。Recall@K 是前 K 条找回的相关资料数占全部已知相关资料数的比例；单次查询 RR 是首个相关结果排名的倒数，MRR 是多次查询 RR 的均值；nDCG 综合相关程度与位置，并相对理想排序归一化。","example":"找“报名截止时间”，先搜出几十段，再把真正写截止时间的段落排前。若首个相关结果在第 2 位，这次 RR=1/2；多个问题的 RR 平均才是 MRR。最初完全没召回的资料，重排不能凭空补回。","pitfall":"检索指标和回答是否忠实是两件事；排序靠前的资料仍可能过期或没有访问权限。","topic":"rag","domainId":"d10","domain":"人工智能前沿技术与生成式大模型","kind":"supplement","conceptSources":[{"key":"retrieval","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第11章 检索与 RAG","url":"https://web.stanford.edu/~jurafsky/slp3/11.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"}],"sources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"},{"key":"retrieval","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第11章 检索与 RAG","url":"https://web.stanford.edu/~jurafsky/slp3/11.pdf"}],"relatedQuestions":["OM01","OP32B","CQ-S08","QA-11"]},{"id":"S09","title":"KV Cache 与 PagedAttention","point":"KV Cache 与 PagedAttention","unit":"样卷细拆考点","level":"补充","page":5,"summary":"KV Cache 保存已处理 token 的键和值。","concept":"自回归注意力可缓存先前 token 在各层产生的 K、V 张量，避免每步重复计算。PagedAttention 用块及映射管理这些缓存，减少连续预留带来的空间浪费，并支持共享等机制。","example":"聊天助手生成一段回复时，后续 token 要参考前文。前文已算出的 K、V 张量可以缓存，后续不必重算这些张量，但仍要进行新的查询和注意力计算。这不是把前文压成摘要，也不是缓存整段答案。","pitfall":"KV Cache 和保存“这个问题上次答什么”的语义缓存不同；缓存仍会占显存。","topic":"serving","domainId":"d10","domain":"人工智能前沿技术与生成式大模型","kind":"supplement","aliases":"分页注意力 键值缓存 paged attention","conceptSources":[{"key":"pretrain","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第7章 Transformer 与预训练","url":"https://web.stanford.edu/~jurafsky/slp3/7.pdf"},{"key":"pages","record":"R09","category":"官方技术文档","label":"vLLM · PagedAttention","url":"https://docs.vllm.ai/en/stable/design/paged_attention/"}],"conceptKind":"definition","scopeSources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"}],"sources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"},{"key":"pretrain","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第7章 Transformer 与预训练","url":"https://web.stanford.edu/~jurafsky/slp3/7.pdf"},{"key":"pages","record":"R09","category":"官方技术文档","label":"vLLM · PagedAttention","url":"https://docs.vllm.ai/en/stable/design/paged_attention/"}],"relatedQuestions":["OC06","OP21","CQ-S09","QA-09"]},{"id":"S10","title":"批处理与请求调度","point":"批处理与请求调度","unit":"样卷细拆考点","level":"补充","page":5,"summary":"批处理把多个请求放在一起计算。","concept":"静态批处理固定一批请求；连续批处理可在生成迭代之间加入或移除请求。调度决定处理顺序，如先来先服务或按优先级；抢占会涉及状态保存或重算等成本。","example":"聊天助手同时处理几个人的请求，有人只要一句话，有人要长回复。短回复结束后，后续解码轮次可加入新请求，不必等长回复全部结束。这是在计算迭代之间调度，不是把独立回复拼成一段。","pitfall":"优先级没有防饥饿措施时，普通请求可能一直排不上；批量大也不保证每人等待短。","topic":"serving","domainId":"d10","domain":"人工智能前沿技术与生成式大模型","kind":"supplement","conceptSources":[{"key":"vllm","record":"R08","category":"官方技术文档","label":"vLLM · 模型服务与调度","url":"https://docs.vllm.ai/en/stable/"}],"conceptKind":"definition","scopeSources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"}],"sources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"},{"key":"vllm","record":"R08","category":"官方技术文档","label":"vLLM · 模型服务与调度","url":"https://docs.vllm.ai/en/stable/"}],"relatedQuestions":["OC06","OP11","OP21","OP24","CQ-S10"]},{"id":"S11","title":"投机解码","point":"投机解码","unit":"样卷细拆考点","level":"补充","page":5,"summary":"投机解码由草稿提出候选，目标模型验证。","concept":"投机解码先用较便宜的方法提出多个候选 token，再由目标模型验证并接受其中符合规则的部分。采用相应精确算法时可保持目标输出分布；加速效果取决于接受率、草稿成本和运行负载。","example":"聊天助手续写一段短消息时，草稿方法先提出几个候选 token，目标模型再批量验证。若中间候选未通过，就按算法的接受与校正规则继续；不是用户觉得句子顺眼就算通过，也不保证草稿全被接受。","pitfall":"草稿经常被拒绝或验证开销太大时，可能没有加速，甚至更慢。","topic":"serving","domainId":"d10","domain":"人工智能前沿技术与生成式大模型","kind":"supplement","aliases":"speculative decoding 投机采样","conceptSources":[{"key":"spec","record":"R10","category":"官方技术文档","label":"vLLM · 投机解码与适用负载","url":"https://docs.vllm.ai/en/latest/features/speculative_decoding/index.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"}],"sources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"},{"key":"spec","record":"R10","category":"官方技术文档","label":"vLLM · 投机解码与适用负载","url":"https://docs.vllm.ai/en/latest/features/speculative_decoding/index.html"}],"relatedQuestions":["OP11","OP22","CQ-S11"]},{"id":"S12","title":"TTFT、TPOT 与吞吐","point":"TTFT、TPOT 与吞吐","unit":"样卷细拆考点","level":"补充","page":5,"summary":"TTFT、TPOT 和吞吐衡量不同方面。","concept":"同一测量端点下，TTFT 是请求开始至首 token 的时间。输出 N>1 个 token 时，TPOT=(完成时间−首 token 时间)/(N−1)。N≤1 时无后续间隔，需注明统计约定，vLLM 可记录为 0；ITL 是相邻流式输出的间隔，多 token 一次发出时不等于单 token 耗时。吞吐按单位时间的请求或 token 数计。","example":"假设聊天请求在 0 秒开始，2 秒收到首 token，3.8 秒全部完成，共输出 10 个 token：TTFT=2 秒，TPOT=(3.8−2)/(10−1)=0.2 秒/token。这里数的是 token，不是汉字；换测量端点或按网络分块计时，数值口径也可能不同。","pitfall":"TPOT 用 ms/token 表示时越小通常越快；总吞吐提高，不代表每人的首 token 都更快。","topic":"serving","domainId":"d10","domain":"人工智能前沿技术与生成式大模型","kind":"supplement","aliases":"首字延迟 首token时延 每token耗时 throughput","conceptSources":[{"key":"metrics","record":"R08","category":"官方技术文档","label":"vLLM · 指标计量口径","url":"https://docs.vllm.ai/en/latest/design/metrics/"}],"conceptKind":"definition","scopeSources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"}],"sources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"},{"key":"metrics","record":"R08","category":"官方技术文档","label":"vLLM · 指标计量口径","url":"https://docs.vllm.ai/en/latest/design/metrics/"}],"relatedQuestions":["OC07","OM01","OP11","OP22","OP24","CQ-S12","QA-10"]},{"id":"S13","title":"语义缓存与模型路由","point":"语义缓存与模型路由","unit":"样卷细拆考点","level":"补充","page":5,"summary":"语义缓存复用近似问题的结果，路由选择处理方式。","concept":"语义缓存按向量等相似性查找可复用结果；模型路由按任务和策略选择模型或其他处理路径。复用需同时满足资料版本、权限和关键条件，不能只比较问题写法。","example":"昨天有人问“图书馆几点关门”，今天闭馆时间变了，昨天的答案就不能直接复用。两个问法很像，也不代表条件没变。","pitfall":"语义相似不等于答案可复用；不得向无权用户复用含私有信息的结果。即使共同有权访问，也要核对版本和问题条件。","topic":"serving","domainId":"d10","domain":"人工智能前沿技术与生成式大模型","kind":"supplement","conceptSources":[{"key":"cache","record":"R50","category":"官方源码","label":"RedisVL · SemanticCache，相似阈值、TTL 与过滤字段","url":"https://github.com/redis/redis-vl-python/blob/main/redisvl/extensions/cache/llm/semantic.py"}],"conceptKind":"definition","scopeSources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"}],"sources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"},{"key":"cache","record":"R50","category":"官方源码","label":"RedisVL · SemanticCache，相似阈值、TTL 与过滤字段","url":"https://github.com/redis/redis-vl-python/blob/main/redisvl/extensions/cache/llm/semantic.py"}],"sourceNote":"RedisVL 来源用于语义缓存；模型路由部分为工程概述，不是该库的定义。","relatedQuestions":["OP11","CQ-S13"]},{"id":"S14","title":"推理框架选型","point":"推理框架选型","unit":"样卷细拆考点","level":"补充","page":5,"summary":"推理框架提供模型运行和服务能力。","concept":"vLLM、TGI、SGLang 和 TensorRT-LLM 都有各自的模型服务与优化支持；支持范围依模型、硬件和版本变化。选型应比较需要的功能与同条件测试结果，不能按名称推断固定性能排名。","example":"在同一台电脑上，用同一模型、同一批问题，固定精度、并发和生成长度等设置，再比较不同框架。只固定问题长度，却换了模型、精度或负载，就不能把速度差全归给框架。","pitfall":"本项目未对这些框架做性能实测；TGI 等项目维护状态也需按所用版本检查。","topic":"serving","domainId":"d10","domain":"人工智能前沿技术与生成式大模型","kind":"supplement","conceptSources":[{"key":"vllm","record":"R08","category":"官方技术文档","label":"vLLM · 模型服务与调度","url":"https://docs.vllm.ai/en/stable/"},{"key":"tgi","record":"R22","category":"官方技术文档","label":"TGI · 服务定位与维护说明","url":"https://huggingface.co/docs/text-generation-inference/index"},{"key":"sglang","record":"R22","category":"官方技术文档","label":"SGLang · 官方概览","url":"https://docs.sglang.io/"},{"key":"tensorrt","record":"R22","category":"官方技术文档","label":"TensorRT-LLM · 官方概览","url":"https://nvidia.github.io/TensorRT-LLM/overview.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"}],"sources":[{"label":"本地公开模拟卷","url":"41A1/41A.pdf"},{"label":"考试院模拟卷入口","url":"https://scite.shmeea.edu.cn/home/TestPaper"},{"key":"vllm","record":"R08","category":"官方技术文档","label":"vLLM · 模型服务与调度","url":"https://docs.vllm.ai/en/stable/"},{"key":"tgi","record":"R22","category":"官方技术文档","label":"TGI · 服务定位与维护说明","url":"https://huggingface.co/docs/text-generation-inference/index"},{"key":"sglang","record":"R22","category":"官方技术文档","label":"SGLang · 官方概览","url":"https://docs.sglang.io/"},{"key":"tensorrt","record":"R22","category":"官方技术文档","label":"TensorRT-LLM · 官方概览","url":"https://nvidia.github.io/TensorRT-LLM/overview.html"}],"relatedQuestions":["OP23","CQ-S14"]},{"id":"S15","title":"多租户端到端隔离","point":"多租户端到端隔离","unit":"样卷细拆考点","level":"补充","page":5,"summary":"多租户隔离限制不同用户组的数据访问。","concept":"租户是系统中需隔离的一组用户和资源。服务端验证身份并确定权限，在检索、缓存、工具、日志及输出等环节保持边界；隔离可采用物理分离或适当的逻辑访问控制。","example":"假设两所学校是平台的两个租户，甲校账号不能因为在问题里写“我是乙校老师”，就读到乙校内部文件。老师、学生也可能是同一租户中的不同角色，角色和租户
