/* A fixed study workspace: only the reading areas page or scroll. */
@media screen {
  :root { --header-height:80px; --heading-slot:104px; }
  html,body { height:100%; overflow:hidden; }
  body { height:100dvh; display:flex; flex-direction:column; overscroll-behavior:none; }
  .site-header { position:relative; height:var(--header-height); flex:0 0 var(--header-height); }
  .main-nav { top:0; height:var(--header-height); }
  .more-trigger { min-width:44px; min-height:44px; }
  .work-area { flex:1 1 0; min-height:0; width:min(var(--measure),calc(100% - 48px)); margin:0 auto; padding:18px 0 max(8px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
  .toolbar { flex:0 0 40px; min-height:40px; height:40px; margin:0 0 12px; }
  .toolbar select { min-height:40px; font-size:20px; }
  .toolbar>.position { display:none; }
  .toolbar #topic-select { max-width:calc(100% - 110px); }
  .toolbar.switch-only { justify-content:flex-end; }
  .site-switch-link { display:inline-flex; align-items:center; justify-content:center; gap:5px; flex:0 0 auto; min-height:44px; padding:6px 8px; color:var(--blue); border-radius:6px; text-decoration:none; font-size:15px; white-space:nowrap; }
  .site-switch-link svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.7; }
  .site-switch-link:hover { background:var(--blue-soft); }
  .site-switch-link:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  #workspace { flex:1 1 0; min-height:0; display:flex; flex-direction:column; gap:10px; }
  .study-panel { flex:1 1 0; min-height:0; padding:24px 36px 10px; display:flex; flex-direction:column; overflow:hidden; }
  .panel-heading { flex:0 0 auto; min-height:var(--heading-slot); gap:18px; }
  .panel-heading h1 { font-size:40px; line-height:1.3; }
  .bookmark { margin:0; min-width:44px; min-height:44px; }
  .card-tabs { flex:0 0 44px; min-height:44px; margin:0; gap:40px; }
  .card-tab { min-width:44px; min-height:44px; padding:6px 0 10px; font-size:19px; }
  .reading-area { position:relative; min-height:0; overflow:auto; overscroll-behavior:contain; overflow-anchor:none; scrollbar-gutter:stable; scrollbar-width:thin; scrollbar-color:#b1b8c5 transparent; }
  .reading-area::-webkit-scrollbar { width:6px; height:6px; }
  .reading-area::-webkit-scrollbar-thumb { background:#b1b8c5; border-radius:4px; }
  .reading-area:focus-visible { outline:2px solid var(--blue); outline-offset:-2px; }
  .card-content { flex:1 1 0; min-height:0; padding:16px 8px 8px 0; animation:none; }
  .card-content h2 { font-size:26px; line-height:1.6; }
  .card-content p { font-size:19px; line-height:1.8; }
  .flow { gap:20px; margin-top:24px; font-size:21px; }
  .panel-tools { flex:0 0 52px; min-height:52px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:8px; }
  .reading-pager { display:flex; flex:0 0 auto; justify-content:center; align-items:center; gap:4px; min-height:44px; color:var(--muted); font-size:14px; }
  .reading-pager button { min-height:44px; min-width:48px; padding:6px 8px; border-radius:6px; color:var(--blue); white-space:nowrap; }
  .reading-pager button:hover:not(:disabled) { background:var(--blue-soft); }
  .reading-pager button:disabled { color:var(--muted); }
  .reading-position { min-width:44px; text-align:center; font-variant-numeric:tabular-nums; }
  .panel-tools .sources,.quiz-panel .sources { margin:0; flex:0 0 auto; font-size:15px; }
  .source-trigger { display:flex; align-items:center; gap:5px; padding:6px; min-height:44px; color:var(--text); font-size:15px; }
  .source-trigger:hover { color:var(--blue); }
  .action-row { flex:0 0 48px; min-height:48px; height:48px; margin:0; gap:10px; }
  .action-row .primary-btn { min-height:48px; font-size:18px; padding:10px 24px; }
  .card-actions-left,.answer-tools { display:flex; align-items:center; gap:8px; min-width:0; }
  .text-btn { min-height:44px; font-size:17px; padding:6px 10px; white-space:nowrap; }
  .back-context { margin:0; padding:6px; font-size:15px; }
  .mastery-menu { top:auto; bottom:calc(100% + 6px); max-height:min(300px,70dvh); overflow:auto; }
  .mastery-menu button { min-height:44px; }
  .deck-nav { flex:0 0 44px; min-height:44px; height:44px; margin:0; gap:clamp(12px,4vw,60px); font-size:17px; }
  .deck-middle { display:flex; gap:10px; align-items:center; font-variant-numeric:tabular-nums; }
  .random-link { font-size:14px; color:var(--blue); }
  .keyboard-hint { flex:0 0 18px; min-height:18px; height:18px; margin:0; font-size:12px; line-height:18px; }
  .quiz-filters { flex:0 0 auto; margin:0; gap:8px; }
  .quiz-filters .filter-select { min-height:40px; }
  .quiz-panel { padding:18px 28px 10px; }
  .quiz-panel .panel-heading { min-height:64px; }
  .quiz-panel .panel-heading h1 { font-size:25px; line-height:1.4; }
  .question-meta { flex:0 0 auto; margin:0 0 4px; font-size:13px; line-height:1.7; }
  .quiz-content { flex:1 1 0; padding:8px 8px 8px 0; }
  .question-stem { margin:0 0 16px; }
  .question-context { margin:4px 0 14px; }
  .options { margin:14px 0 0; }
  .explanation { animation:none; }
  .answer-text { min-height:140px; margin-top:12px; }
  .footer-note { flex:0 0 36px; min-height:36px; height:36px; margin:0; overflow:auto; line-height:18px; font-size:12px; }
  .saved-view .library-heading { flex:0 0 44px; min-height:44px; margin:0; }
  .saved-view .sub-nav { flex:0 0 46px; min-height:46px; margin:0; gap:24px; }
  .saved-content { flex:1 1 0; }
  .saved-view .reading-pager { flex:0 0 44px; }
  .empty-state { min-height:0; padding:24px 16px; overflow:auto; }
  .toast { pointer-events:none; }
  .storage-warning { flex:0 0 auto; padding:4px 12px; font-size:12px; }
  dialog[open] { display:flex; flex-direction:column; width:min(760px,calc(100vw - 32px)); height:min(760px,calc(100dvh - 48px)); max-height:calc(100dvh - 48px); padding:22px; overflow:hidden; }
  .dialog-head { flex:0 0 44px; min-height:44px; margin:0 0 12px; }
  .dialog-head .icon-btn { min-width:44px; min-height:44px; }
  #search-input { flex:0 0 48px; min-height:48px; }
  #search-results,#settings-content,#source-content { flex:1 1 0; min-height:0; max-height:none; }
  dialog>.reading-pager { flex:0 0 48px; margin-top:8px; }
  .source-dialog .source-body { padding-top:0; }
  .font-license { max-height:none; overflow:visible; }
}

  <script>window.AI41_DATA = {"version":1,"updated":"2026-11-15","cards":[{"id":"K001","domain":"人工智能概述","unit":"人工智能基本概念","point":"人工智能定义、起源","level":"理解","page":2,"title":"人工智能是什么","summary":"研究和实现机器的智能行为。","concept":"人工智能研究如何用计算系统实现感知、学习、推理、决策等智能行为。OECD 将“人工智能系统”描述为基于机器的系统：针对显式或隐式目标，从输入推断如何产生预测、内容、建议或决策，影响现实或虚拟环境。不同系统的自主性及部署后的适应性不同。1956 年达特茅斯研究计划是学科形成的重要标志。","example":"手机相册把猫的照片归到一起，是识别图像；地图根据路况推荐路线，是辅助决策。这些都是 AI 的应用，不要求机器长得像人。","pitfall":"人工智能是一个研究领域；人工智能系统是具体系统。会聊天不等于有人的意识，也不保证说的都对。","topic":"foundation","domainId":"d01","kind":"syllabus","conceptSources":[{"key":"oecd","record":"R26","category":"国际组织说明","label":"OECD 2024 · AI 系统定义与解释","url":"https://www.oecd.org/content/dam/oecd/en/publications/reports/2024/03/explanatory-memorandum-on-the-updated-oecd-definition-of-an-ai-system_3c815e51/623da898-en.pdf#page=6"},{"key":"dartmouth","record":"R51","category":"历史原始文献","label":"McCarthy 等 · 1955 年提案与 1956 年研究计划","url":"https://www-formal.stanford.edu/jmc/history/dartmouth/dartmouth.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"oecd","record":"R26","category":"国际组织说明","label":"OECD 2024 · AI 系统定义与解释","url":"https://www.oecd.org/content/dam/oecd/en/publications/reports/2024/03/explanatory-memorandum-on-the-updated-oecd-definition-of-an-ai-system_3c815e51/623da898-en.pdf#page=6"},{"key":"dartmouth","record":"R51","category":"历史原始文献","label":"McCarthy 等 · 1955 年提案与 1956 年研究计划","url":"https://www-formal.stanford.edu/jmc/history/dartmouth/dartmouth.html"}],"sourceNote":"OECD 文档定义的是 AI 系统；达特茅斯提案用于核对历史时间。","relatedQuestions":["OT06","CQ-K001"]},{"id":"K002","domain":"人工智能概述","unit":"人工智能的发展历史","point":"人工智能研究方向","level":"知道","page":2,"title":"人工智能的研究方向","summary":"研究方向对应不同的智能能力。","concept":"大纲涉及机器学习、知识表示与推理、计算机视觉、语音处理、自然语言处理和机器人等方向。它们研究的问题不同，同一个系统可以同时使用多个方向的技术。","example":"你对手机说“明早七点叫我起床”：语音识别先把声音变成文字，语言处理再判断你要设闹钟。","pitfall":"“计算机视觉”是技术方向；“医疗”是应用领域。两者不是同一级的分类。","topic":"foundation","domainId":"d01","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K002"]},{"id":"K003","domain":"人工智能概述","unit":"人工智能的发展历史","point":"人工智能流派","level":"知道","page":2,"title":"人工智能的三种流派","summary":"三种流派对智能的实现有不同解释。","concept":"符号主义以符号表示知识，通过逻辑规则进行推理；连接主义以神经元之间的连接和权重变化模拟学习；行为主义强调智能体通过与环境的交互形成行为。这里按大纲列出的三种流派区分。","example":"认水果可以走不同思路：写下“有这些特征就判为苹果”的规则，接近符号方法；用很多照片训练网络，接近连接方法。试着抓水果、根据抓稳或掉落来调整动作，体现交互学习的思路。","pitfall":"流派是理论侧重，不是互不兼容的软件。同一个系统可以把规则和神经网络结合起来。","topic":"foundation","domainId":"d01","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K003"]},{"id":"K004","domain":"人工智能概述","unit":"智能计算系统","point":"智能计算系统定义与组成","level":"理解","page":2,"title":"智能计算系统","summary":"计算系统包含硬件和软件。","concept":"硬件承担运算、存储和通信；操作系统管理硬件资源；算法框架与应用程序执行训练、推理等任务。数据是这些任务处理的对象，也是模型学习的重要依据。","example":"用电脑给照片分类：硬盘保存照片，内存放正在处理的数据，CPU 或 GPU 做计算，程序显示分类结果。","pitfall":"硬盘、内存和显存作用不同；只说“有一个模型”，还没有说清整个计算系统。","topic":"foundation","domainId":"d01","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["OT03","CQ-K004"]},{"id":"K005","domain":"人工智能概述","unit":"人工智能应用","point":"人工智能典型应用领域与场景","level":"理解","page":2,"title":"从任务识别 AI 场景","summary":"应用场景要对应具体任务。","concept":"AI 可用于分类、预测、生成、检索和决策等任务；同一行业往往包含多个任务。分析场景时应明确输入、输出、使用者和检查结果的方法，不能把行业名称当成算法名称。","example":"网购时，搜索商品是检索，猜你想买什么是推荐，给商品照片分类是图像识别。都在购物软件里，做的事却不同。","pitfall":"“智能制造”是应用领域，不是一种固定算法。","topic":"foundation","domainId":"d01","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["OT12","CQ-K005"]},{"id":"K006","domain":"人工智能概述","unit":"通用大模型与专业大模型工具","point":"通用大模型案例AI应用程序与操作","level":"理解","page":2,"title":"通用大模型工具","summary":"通用大模型可处理多种任务。","concept":"通用大模型通常经过大规模数据训练，能够在不同任务中使用；用户可通过对话界面或程序接口提出问题、提供材料并获得输出。具体能力以对应工具说明为准。","example":"把班级通知交给对话工具，说“请找出报名截止日期和地点”。它给出结果后，再对照通知看看有没有抄错。","pitfall":"提示写得清楚有助于表达要求，但不能保证回答每次都正确。","topic":"foundation","domainId":"d01","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["OM09","OB1","CQ-K006"]},{"id":"K007","domain":"人工智能概述","unit":"通用大模型与专业大模型工具","point":"专业集成大模型千学百科AI集成平台","level":"理解","page":2,"title":"千学百科与集成大模型平台","summary":"集成平台把多种模型能力放在一起。","concept":"考纲点名“专业集成大模型千学百科 AI 集成平台”。平台可提供模型调用、知识库、工具接入和应用搭建等功能；平台、模型和具体应用属于不同层次。具体入口与可用功能以学校平台及账号权限为准。","example":"学校平台里既有“问课程安排”，也有“帮写代码”。你选的是不同应用，它们背后可能调用不同模型和资料。","pitfall":"看到同一个平台入口，不代表能使用平台中的所有模型或读取全部资料。","topic":"foundation","domainId":"d01","kind":"syllabus","conceptSources":[{"key":"qianxue","record":"R58","category":"学校公开资料","label":"上海大学千学百科 · 四级水平测试与平台入口","url":"https://aiforall.shu.edu.cn/sjspcs.htm"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"qianxue","record":"R58","category":"学校公开资料","label":"上海大学千学百科 · 四级水平测试与平台入口","url":"https://aiforall.shu.edu.cn/sjspcs.htm"}],"sourceNote":"学校来源用于核对平台名称和公开入口；没有把规划中的功能或未登录查看的功能写成已经实测。","relatedQuestions":["CQ-K007"]},{"id":"K008","domain":"数学基础与计算思维","unit":"数学基础","point":"线性代数基础","level":"理解","page":2,"title":"线性代数：向量与矩阵","summary":"向量是一组有序的数，矩阵是数的二维排列。","concept":"在本考点中，向量是一组有序数值，矩阵按行和列组织数值。等长实向量的点积是对应分量相乘后求和。若 A 为 m×n、B 为 n×p，则 AB 为 m×p；矩阵转置交换行列。向量的欧氏范数是各分量平方和的平方根，用于表示长度。","example":"苹果每斤 3 元、橙子每斤 5 元，价格写成 [3,5]；买 2 斤苹果、1 斤橙子，数量写成 [2,1]。点积是 3×2＋5×1＝11 元。","pitfall":"两个矩阵并非什么形状都能相乘。向量维度相同，也不代表它们的每一维含义相同。","topic":"foundation","domainId":"d02","kind":"syllabus","conceptSources":[{"key":"algebra","record":"R27","category":"作者教材","label":"《动手学深度学习》2.3 · 向量、矩阵与点积","url":"https://zh.d2l.ai/chapter_preliminaries/linear-algebra.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"algebra","record":"R27","category":"作者教材","label":"《动手学深度学习》2.3 · 向量、矩阵与点积","url":"https://zh.d2l.ai/chapter_preliminaries/linear-algebra.html"}],"relatedQuestions":["CQ-K008","QA-01"]},{"id":"K009","domain":"数学基础与计算思维","unit":"数学基础","point":"微积分基础","level":"理解","page":2,"title":"微积分：导数、梯度与积分","summary":"导数看局部变化，积分看区间累积。","concept":"导数描述局部变化率；偏导数对一个变量求导时保持其他变量不变，各偏导数组成梯度。梯度下降按 θ←θ−η∇L 更新参数。定积分是区间内微小贡献之和的极限，可表示带符号的累积量；不定积分表示一族原函数。","example":"骑车时，路程对时间的导数是瞬时速度；把一段时间内的速度积分，可求有方向的位移。若一直朝前以 3 米/秒骑 10 秒，就走了 30 米。用于优化时，在光滑且梯度非零的位置，负梯度是局部下降最快的方向。","pitfall":"速度变号时，速度积分得到位移，不一定是总路程；总路程要积分速率。梯度为零时不能说还有唯一的最快下降方向，梯度下降也不保证找到全局最优。","topic":"foundation","domainId":"d02","kind":"syllabus","conceptSources":[{"key":"calculus","record":"R27","category":"作者教材","label":"《动手学深度学习》2.4 · 导数、梯度与链式法则","url":"https://zh.d2l.ai/chapter_preliminaries/calculus.html"},{"key":"integral","record":"R57","category":"作者教材","label":"OpenStax Calculus 1 · §5.2 定积分与带符号累积","url":"https://openstax.org/books/calculus-volume-1/pages/5-2-the-definite-integral"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"calculus","record":"R27","category":"作者教材","label":"《动手学深度学习》2.4 · 导数、梯度与链式法则","url":"https://zh.d2l.ai/chapter_preliminaries/calculus.html"},{"key":"integral","record":"R57","category":"作者教材","label":"OpenStax Calculus 1 · §5.2 定积分与带符号累积","url":"https://openstax.org/books/calculus-volume-1/pages/5-2-the-definite-integral"}],"relatedQuestions":["CQ-K009","QA-02"]},{"id":"K010","domain":"数学基础与计算思维","unit":"数学基础","point":"概率与统计基础","level":"理解","page":2,"title":"概率与统计","summary":"条件概率是在已知条件下计算的概率。","concept":"概率在 0 到 1 之间，描述事件发生的可能性；统计利用样本描述和推断总体规律。P(A｜B) 表示已知 B 发生时 A 的概率，要求 P(B)>0。独立表示联合概率等于各自概率的乘积。期望是按概率加权的平均，方差是偏离期望的平方的期望。","example":"下雨时，很多人会带伞；但看到有人带伞，不能立刻断定下雨了，他也可能在遮阳。“下雨时带伞”和“带伞时下雨”是两个不同的条件概率。","pitfall":"P(A｜B) 一般不等于 P(B｜A)；两件事一起出现，也不能直接说明谁导致了谁。","topic":"foundation","domainId":"d02","kind":"syllabus","conceptSources":[{"key":"probability","record":"R27","category":"作者教材","label":"《动手学深度学习》2.6 · 条件概率、期望与方差","url":"https://zh.d2l.ai/chapter_preliminaries/probability.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"probability","record":"R27","category":"作者教材","label":"《动手学深度学习》2.6 · 条件概率、期望与方差","url":"https://zh.d2l.ai/chapter_preliminaries/probability.html"}],"relatedQuestions":["CQ-K010"]},{"id":"K011","domain":"数学基础与计算思维","unit":"计算思维基础","point":"计算思维概述","level":"理解","page":2,"title":"计算思维","summary":"把问题和解法表示成可执行的形式。","concept":"计算思维关注如何表述问题及其解法，使解法能由信息处理主体有效执行。常用方法包括抽象、分解和算法设计；执行者可以是人，也可以是计算机。","example":"整理购物清单时，先把重复商品合并，再按蔬菜、日用品分组，最后逐项购买。你把一件容易漏项的事，变成了可以照着做的步骤。","pitfall":"计算思维不等于写代码。程序写得再快，问题理解错了仍然得不到想要的结果。","topic":"foundation","domainId":"d02","kind":"syllabus","conceptSources":[{"key":"wing","record":"R29","category":"作者原文","label":"Wing 2010 · Computational Thinking: What and Why?","url":"https://www.cs.cmu.edu/~./CompThink/resources/TheLinkWing.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"wing","record":"R29","category":"作者原文","label":"Wing 2010 · Computational Thinking: What and Why?","url":"https://www.cs.cmu.edu/~./CompThink/resources/TheLinkWing.pdf"}],"relatedQuestions":["CQ-K011"]},{"id":"K012","domain":"数学基础与计算思维","unit":"计算思维基础","point":"数学建模基础","level":"理解","page":2,"title":"数学建模","summary":"数学模型用数学关系描述实际问题。","concept":"数学建模把实际问题转化为变量、关系、目标与约束，并在一定假设下求解和检验。模型只保留与问题有关的部分，不是对现实的完整复制。","example":"给同学排值日表：变量是谁在哪天值日，约束是每人可来的时间，目标可以是每人次数尽量一样。","pitfall":"模型要说明假设。假设“大家每天都有空”，排出来的表就可能根本用不了。","topic":"foundation","domainId":"d02","kind":"syllabus","conceptSources":[{"key":"mathmodel","record":"R54","category":"学会指南","label":"SIAM · Math Modeling: Computing & Communicating，第1章","url":"https://m3challenge.siam.org/wp-content/uploads/siam-technical-guidebook-web-bw.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"mathmodel","record":"R54","category":"学会指南","label":"SIAM · Math Modeling: Computing & Communicating，第1章","url":"https://m3challenge.siam.org/wp-content/uploads/siam-technical-guidebook-web-bw.pdf"}],"relatedQuestions":["CQ-K012"]},{"id":"K013","domain":"数学基础与计算思维","unit":"计算思维基础","point":"Python程序设计","level":"掌握","page":2,"title":"Python 与 API 基础","summary":"Python 用变量、表达式和语句组织程序。","concept":"变量名引用对象；列表按顺序保存元素，字典保存键值对应。if/elif/else 选择分支，for/while 重复执行，def 定义函数，return 返回结果，try/except 处理异常。Python 用缩进表示代码块；缩进不同会改变语句的执行范围。","example":"购物清单可以写成列表。用循环逐个读出商品名，再用字典查单价并相加，就能算总价。","pitfall":"字符串要有引号；缩进会改变语句执行范围。接口密钥不应写进公开代码或截图。","topic":"foundation","domainId":"d02","kind":"syllabus","conceptSources":[{"key":"python","record":"R30","category":"官方技术文档","label":"Python 教程 · 控制流、函数与缩进","url":"https://docs.python.org/zh-cn/3/tutorial/controlflow.html"},{"key":"pythondata","record":"R30","category":"官方技术文档","label":"Python 教程 · §5 列表和字典","url":"https://docs.python.org/zh-cn/3/tutorial/datastructures.html"},{"key":"pythonerrors","record":"R30","category":"官方技术文档","label":"Python 教程 · §8 try/except 与异常","url":"https://docs.python.org/zh-cn/3/tutorial/errors.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"python","record":"R30","category":"官方技术文档","label":"Python 教程 · 控制流、函数与缩进","url":"https://docs.python.org/zh-cn/3/tutorial/controlflow.html"},{"key":"pythondata","record":"R30","category":"官方技术文档","label":"Python 教程 · §5 列表和字典","url":"https://docs.python.org/zh-cn/3/tutorial/datastructures.html"},{"key":"pythonerrors","record":"R30","category":"官方技术文档","label":"Python 教程 · §8 try/except 与异常","url":"https://docs.python.org/zh-cn/3/tutorial/errors.html"}],"relatedQuestions":["OT13","CQ-K013"]},{"id":"K014","domain":"数学基础与计算思维","unit":"计算思维基础","point":"算法与算法评价","level":"掌握","page":2,"title":"算法与复杂度","summary":"算法是解决一类问题的有限步骤。","concept":"算法给出明确、可执行并能结束的步骤。时间复杂度描述输入规模增长时运算量的增长趋势；空间复杂度描述所需额外存储等空间的增长趋势。比较时要说明采用的计量口径。","example":"在没有排序的通讯录里逐个找姓名，最坏可能查完 n 人，时间是 O(n)。若姓名已排序，二分查找每次排除约一半，时间是 O(log n)。","pitfall":"先检查算法是否正确，再比较时间和空间。O(n) 是增长趋势，不是精确耗时；小数据还会受常数开销等影响。","topic":"foundation","domainId":"d02","kind":"syllabus","conceptSources":[{"key":"algorithm","record":"R49","category":"机构术语词典","label":"NIST DADS · algorithm","url":"https://xlinux.nist.gov/dads/HTML/algorithm.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"algorithm","record":"R49","category":"机构术语词典","label":"NIST DADS · algorithm","url":"https://xlinux.nist.gov/dads/HTML/algorithm.html"}],"sourceNote":"NIST 条目用于算法的基本含义；复杂度部分为考纲要求下的通用释义。","relatedQuestions":["CQ-K014"]},{"id":"K015","domain":"数学基础与计算思维","unit":"操作系统与linux基础","point":"操作系统原理基础","level":"掌握","page":2,"title":"操作系统基础","summary":"操作系统管理计算机资源。","concept":"操作系统负责进程调度、内存管理、文件管理和设备管理等工作。进程是运行中的程序及其资源；线程是进程中的执行单元，同一进程的线程共享部分资源。","example":"同时开着浏览器和音乐软件，系统把计算时间分给它们，并管理各自使用的内存。下载文件则需要硬盘空间。","pitfall":"硬盘满了和显存不够是不同问题，不能用同一种处理办法。","topic":"foundation","domainId":"d02","kind":"syllabus","conceptSources":[{"key":"ostep","record":"R31","category":"作者教材","label":"OSTEP 1.10 · 进程、线程、内存与文件","url":"https://pages.cs.wisc.edu/~remzi/OSTEP/"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"ostep","record":"R31","category":"作者教材","label":"OSTEP 1.10 · 进程、线程、内存与文件","url":"https://pages.cs.wisc.edu/~remzi/OSTEP/"}],"relatedQuestions":["OB2","CQ-K015"]},{"id":"K016","domain":"数学基础与计算思维","unit":"操作系统与linux基础","point":"linux操作命令","level":"掌握","page":2,"title":"Linux 与日志管理","summary":"Linux 命令按对象和选项执行操作。","concept":"pwd/ls/cd 查看或切换目录；mkdir 创建目录，cp/mv 复制或移动文件，cat/tail 查看文件，ps 查看进程，df/du 查看空间。rm 删除文件，chmod 修改权限，需看清对象和参数。journalctl 查询 systemd journal；--vacuum-time、--vacuum-size 按条件清理归档日志。","example":"想知道电脑里的日志占了多少空间，可以先用 journalctl --disk-usage 查看。若题目要求只保留最近七天的归档日志，可写 sudo journalctl --vacuum-time=7d；这不是清理所有类型日志的通用命令。","pitfall":"清理会改变文件。删除仍被程序打开的日志，不一定马上释放空间；不要把整个日志目录直接删掉。","topic":"foundation","domainId":"d02","kind":"syllabus","conceptSources":[{"key":"linux","record":"R23","category":"官方技术文档","label":"systemd · journalctl 与归档清理","url":"https://www.freedesktop.org/software/systemd/man/latest/journalctl.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 2 页","url":"41/41.pdf#page=2"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"linux","record":"R23","category":"官方技术文档","label":"systemd · journalctl 与归档清理","url":"https://www.freedesktop.org/software/systemd/man/latest/journalctl.html"}],"relatedQuestions":["OB2","CQ-K016"]},{"id":"K017","domain":"生成式人工智能三要素基础","unit":"数据","point":"语料采集","level":"掌握","page":3,"title":"语料采集","summary":"数据采集是获取任务所需数据的过程。","concept":"数据采集可从传感器、已有文件、数据库或经授权的网络来源获取数据。采集方案需要规定对象、方法、范围和质量要求；样本应尽量覆盖将来使用时的情况。","example":"想训练识别苹果的模型，别只拍同一只红苹果。青苹果、切开的苹果、光线暗的照片，也可能是以后会遇到的情况。","pitfall":"把同一张照片复制一百次，文件数增加了，场景并没有变丰富。","topic":"foundation","domainId":"d03","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["OC11","OM03","CQ-K017"]},{"id":"K018","domain":"生成式人工智能三要素基础","unit":"数据","point":"数据标注","level":"掌握","page":3,"title":"数据标注","summary":"数据标注为样本添加任务标签。","concept":"标注按任务提供监督信息，例如图像类别、目标框、像素掩码、文本实体边界和语音转写。标注规范规定标签含义和处理歧义的方式，一致性检查用于发现不同标注者的差异。","example":"给相册里的照片贴“猫”或“狗”标签，是分类标注；把猫的位置框出来，是目标检测标注。","pitfall":"清理重复照片是数据清洗，不是给照片标注类别。","topic":"foundation","domainId":"d03","kind":"syllabus","conceptSources":[{"key":"label","record":"R56","category":"官方历史技术文档","label":"Microsoft Learn · 分类、检测框、分割掩码与文本标注","url":"https://learn.microsoft.com/en-us/azure/machine-learning/how-to-label-data?view=azureml-api-2"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"label","record":"R56","category":"官方历史技术文档","label":"Microsoft Learn · 分类、检测框、分割掩码与文本标注","url":"https://learn.microsoft.com/en-us/azure/machine-learning/how-to-label-data?view=azureml-api-2"}],"relatedQuestions":["OC12","CQ-K018"]},{"id":"K019","domain":"生成式人工智能三要素基础","unit":"数据","point":"数据管理","level":"理解","page":3,"title":"数据管理","summary":"数据管理组织数据及其使用信息。","concept":"数据管理包括存储、组织、检索、版本、质量和访问控制。元数据描述数据本身，例如来源、采集时间和文件类型；版本用于区分同一份数据的不同状态。","example":"班级共享盘里有两份课表，标上“本周生效”和“上周旧版”，大家就不容易拿错。只有文件名、没有日期，往往分不清哪份能用。","pitfall":"备份只是数据管理的一部分，还需要知道哪些资料有效、谁可以读取。","topic":"foundation","domainId":"d03","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["OC11","CQ-K019"]},{"id":"K020","domain":"生成式人工智能三要素基础","unit":"算法","point":"机器学习算法概述","level":"理解","page":3,"title":"机器学习算法","summary":"机器学习利用数据改进任务表现。","concept":"机器学习通过数据或经验学习模型，用来完成预测、分类等任务。监督学习使用目标标签，无监督学习寻找未标注数据中的结构，强化学习通过与环境交互及奖励学习策略。泛化指对未见数据的表现。","example":"看过许多标了“苹果”“橙子”的照片后，模型再判断一张新照片是什么水果。新照片上的结果，才反映它是否学会了可复用的规律。","pitfall":"只记住训练照片，不等于能认出没见过的照片。","topic":"foundation","domainId":"d03","kind":"syllabus","conceptSources":[{"key":"ml","record":"R28","category":"官方技术文档","label":"scikit-learn · 拟合、预测与监督/无监督","url":"https://scikit-learn.org/stable/getting_started.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"ml","record":"R28","category":"官方技术文档","label":"scikit-learn · 拟合、预测与监督/无监督","url":"https://scikit-learn.org/stable/getting_started.html"}],"relatedQuestions":["OC09","OM03","CQ-K020"]},{"id":"K021","domain":"生成式人工智能三要素基础","unit":"算法","point":"深度学习算法概述","level":"理解","page":3,"title":"深度学习算法","summary":"深度学习使用多层神经网络学习表示。","concept":"深度学习是机器学习的一类方法，通过多层可学习的变换得到数据表示和输出。网络的参数通常根据损失函数和优化算法训练；非线性变换使多层网络能够表示复杂关系。","example":"识别手写数字时，网络前面的层可能提取笔画，后面的层把这些信息组合起来判断是几。这里是帮助理解的简化，不是每个神经元都只负责一种笔画。","pitfall":"层数更多并不保证结果更好，仍会受到数据、训练和过拟合等因素影响。","topic":"foundation","domainId":"d03","kind":"syllabus","conceptSources":[{"key":"mlp","record":"R27","category":"作者教材","label":"《动手学深度学习》4.1 · 多层感知机与激活","url":"https://zh.d2l.ai/chapter_multilayer-perceptrons/mlp.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"mlp","record":"R27","category":"作者教材","label":"《动手学深度学习》4.1 · 多层感知机与激活","url":"https://zh.d2l.ai/chapter_multilayer-perceptrons/mlp.html"}],"relatedQuestions":["CQ-K021"]},{"id":"K022","domain":"生成式人工智能三要素基础","unit":"算法","point":"优化算法概述","level":"理解","page":3,"title":"优化算法","summary":"优化算法按规则调整模型参数。","concept":"梯度类优化算法利用损失对参数的梯度进行更新。SGD 使用随机抽取的样本或小批量估计梯度；动量法累积历史方向；Adam 利用梯度的一阶与二阶矩估计调整更新。学习率控制更新幅度。","example":"用一个小模型学习奶茶单价 w：已知 1 杯实际 3 元，当前预测 4 元，损失设为 L=(w−3)²。此时梯度为 2，学习率取 0.1，一步梯度下降后 w=4−0.1×2=3.8。这是按梯度算出的更新，不是人随意决定往哪边调。","pitfall":"Adam 不是“必然找到最好答案”的按钮；优化器和学习率都影响训练结果。","topic":"foundation","domainId":"d03","kind":"syllabus","conceptSources":[{"key":"pytorch","record":"R07","category":"官方技术文档","label":"PyTorch · 训练循环、梯度与优化器","url":"https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial"},{"key":"adam","record":"R45","category":"官方技术文档","label":"PyTorch · Adam 的一阶与二阶矩更新","url":"https://docs.pytorch.org/docs/2.15/generated/torch.optim.Adam.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"pytorch","record":"R07","category":"官方技术文档","label":"PyTorch · 训练循环、梯度与优化器","url":"https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial"},{"key":"adam","record":"R45","category":"官方技术文档","label":"PyTorch · Adam 的一阶与二阶矩更新","url":"https://docs.pytorch.org/docs/2.15/generated/torch.optim.Adam.html"}],"relatedQuestions":["CQ-K022"]},{"id":"K023","domain":"生成式人工智能三要素基础","unit":"算力","point":"CPU与GPU计算硬件基础","level":"掌握","page":3,"title":"CPU、GPU 与资源","summary":"CPU 与 GPU 的结构和擅长任务不同。","concept":"CPU 侧重通用计算和复杂控制；GPU 由大量并行计算单元组成，适合有足够并行度的计算。AI 任务还受内存或显存容量、带宽、通信和软件支持等条件限制。","example":"电脑一边打开文件、一边给一批照片做相同计算：文件处理常由 CPU 协调，照片中的大量并行运算可交给 GPU。","pitfall":"显存不只放模型权重，还可能放中间结果、KV Cache 等；多一张显卡也不保证速度翻倍。","topic":"foundation","domainId":"d03","kind":"syllabus","conceptSources":[{"key":"hardware","record":"R27","category":"作者教材","label":"《动手学深度学习》12.4 · CPU、GPU 与存储","url":"https://zh.d2l.ai/chapter_computational-performance/hardware.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"hardware","record":"R27","category":"作者教材","label":"《动手学深度学习》12.4 · CPU、GPU 与存储","url":"https://zh.d2l.ai/chapter_computational-performance/hardware.html"}],"relatedQuestions":["OM03","OT03","CQ-K023"]},{"id":"K024","domain":"生成式人工智能三要素基础","unit":"算力","point":"软件框架与工具","level":"理解","page":3,"title":"软件框架与工具","summary":"深度学习框架提供张量和自动求导等工具。","concept":"PyTorch、TensorFlow 等框架支持张量计算、模型构建、自动求导和训练。向量数据库负责向量存储与检索；推理服务框架负责承接模型请求。它们可以配合，但职责不同。","example":"训练一个认水果的模型，可以用 PyTorch；把模型放到服务里供网页调用，是部署工作；保存商品图片向量方便搜索，是向量数据库的工作。","pitfall":"Milvus 是向量数据库，PyTorch 是深度学习框架，二者不能当作同一类工具。","topic":"foundation","domainId":"d03","kind":"syllabus","conceptSources":[{"key":"pytorch","record":"R07","category":"官方技术文档","label":"PyTorch · 训练循环、梯度与优化器","url":"https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"pytorch","record":"R07","category":"官方技术文档","label":"PyTorch · 训练循环、梯度与优化器","url":"https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial"}],"relatedQuestions":["CQ-K024"]},{"id":"K025","domain":"生成式人工智能三要素基础","unit":"算力","point":"并行与异构计算及性能优化","level":"理解","page":3,"title":"并行与异构计算","summary":"并行计算把计算任务分给多个执行单元。","concept":"数据并行让模型副本处理不同样本，再按方法同步更新；模型并行把模型参数或计算分到多个设备，流水线并行是按阶段划分的一种方式。异构计算协调 CPU、GPU 等不同设备。通信、同步和负载不均都会影响加速效果。","example":"几个人按同一标准整理不同批照片，最后汇总，类似“同一任务、不同数据”的分工；有人挑图、有人修图、有人排版，类似按阶段分工。这只类比分工方式，模型训练还需要相应的梯度或参数通信。","pitfall":"增加设备会带来通信和协调开销，速度通常不会严格按设备数量成倍增加。","topic":"foundation","domainId":"d03","kind":"syllabus","conceptSources":[{"key":"distributed","record":"R46","category":"官方技术文档","label":"TensorFlow · Multi-worker training 与同步","url":"https://www.tensorflow.org/tutorials/distribute/multi_worker_with_keras"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"distributed","record":"R46","category":"官方技术文档","label":"TensorFlow · Multi-worker training 与同步","url":"https://www.tensorflow.org/tutorials/distribute/multi_worker_with_keras"}],"relatedQuestions":["CQ-K025"]},{"id":"K026","domain":"知识图谱与计算机","unit":"逻辑推理","point":"谓词逻辑表示法","level":"掌握","page":3,"title":"谓词逻辑","summary":"谓词逻辑表示对象、性质和关系。","concept":"常量表示特定对象，变量表示可取不同值的对象，谓词表示性质或关系。全称量词 ∀ 表示论域中的所有对象，存在量词 ∃ 表示论域中至少一个对象。","example":"“所有学生都交了作业”和“有一个学生交了作业”差别很大。前一句用全称量词，后一句用存在量词。","pitfall":"先看清讨论的是哪些对象；“至少一个”不能换成“全部”。","topic":"foundation","domainId":"d04","kind":"syllabus","conceptSources":[{"key":"predicates","record":"R48","category":"大学课程原文","label":"Stanford · First Order Predicate Logic","url":"https://xenon.stanford.edu/~pdoyle/quail/notes/reasoning.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"predicates","record":"R48","category":"大学课程原文","label":"Stanford · First Order Predicate Logic","url":"https://xenon.stanford.edu/~pdoyle/quail/notes/reasoning.html"}],"relatedQuestions":["CQ-K026"]},{"id":"K027","domain":"知识图谱与计算机","unit":"逻辑推理","point":"推理规则","level":"掌握","page":3,"title":"推理规则","summary":"推理规则规定怎样由前提得到结论。","concept":"肯定前件规则：若 P→Q 与 P 均成立，可推出 Q。有效推理保证在前提为真时结论为真；它并不替我们证明现实中的前提一定为真。","example":"已知“参加这次活动的人都领到了纪念章”，又知道小王参加了活动，就能推出小王领到了纪念章。","pitfall":"看到小王有纪念章，不能反推他参加了这次活动；纪念章也可能是别人送的。","topic":"foundation","domainId":"d04","kind":"syllabus","conceptSources":[{"key":"logic","record":"R48","category":"大学课程原文","label":"Stanford CS257 · Lecture 2，肯定前件推理","url":"https://web.stanford.edu/class/cs257/slides/Lecture_2.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"logic","record":"R48","category":"大学课程原文","label":"Stanford CS257 · Lecture 2，肯定前件推理","url":"https://web.stanford.edu/class/cs257/slides/Lecture_2.pdf"}],"relatedQuestions":["CQ-K027"]},{"id":"K028","domain":"知识图谱与计算机","unit":"逻辑推理","point":"确定性与不确定性推理","level":"理解","page":3,"title":"确定与不确定推理","summary":"不确定推理处理信息不完整或带噪声的情况。","concept":"确定性推理按明确的逻辑关系推导结论；不确定推理用概率等方式表示并处理不确定性。概率推断的结果依赖已有信息和模型假设，不是必然成立的逻辑结论。","example":"规则写着“满 18 岁可以报名”，核对年龄就能判断；根据云层和天气记录预测下午下雨，则是在处理不确定性。","pitfall":"“下雨概率很高”不等于“下午一定下雨”。","topic":"foundation","domainId":"d04","kind":"syllabus","conceptSources":[{"key":"probability","record":"R27","category":"作者教材","label":"《动手学深度学习》2.6 · 条件概率、期望与方差","url":"https://zh.d2l.ai/chapter_preliminaries/probability.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"probability","record":"R27","category":"作者教材","label":"《动手学深度学习》2.6 · 条件概率、期望与方差","url":"https://zh.d2l.ai/chapter_preliminaries/probability.html"}],"relatedQuestions":["CQ-K028"]},{"id":"K029","domain":"知识图谱与计算机","unit":"专家系统与知识图谱","point":"专家系统基本原理","level":"理解","page":3,"title":"专家系统","summary":"专家系统利用领域知识进行推理。","concept":"专家系统用显式表示的领域知识解决特定领域问题，通常由知识库、推理机和交互等部分组成。知识库保存事实和规则，推理机按规则推导结论，有的系统还能解释推理过程。","example":"家电排查程序先问“插头插好了吗”“指示灯亮不亮”，再按维修人员整理的规则提示检查位置。它是在用已有规则推理。","pitfall":"专家系统不能自动知道所有新情况；规则需要补充和维护。","topic":"foundation","domainId":"d04","kind":"syllabus","conceptSources":[{"key":"expert","record":"R53","category":"官方工具手册","label":"CLIPS 6.31 User's Guide · 第1章，专家系统","url":"https://www.clipsrules.net/documentation/v631/ug631.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"expert","record":"R53","category":"官方工具手册","label":"CLIPS 6.31 User's Guide · 第1章，专家系统","url":"https://www.clipsrules.net/documentation/v631/ug631.pdf"}],"relatedQuestions":["OC09","CQ-K029"]},{"id":"K030","domain":"知识图谱与计算机","unit":"专家系统与知识图谱","point":"知识图谱基本原理","level":"掌握","page":3,"title":"知识图谱","summary":"知识图谱用图结构组织实体及其关系。","concept":"知识图谱以实体、关系及属性表示知识。常见事实形式是三元组；RDF 中相应形式为“主语—谓语—宾语”，宾语可为资源或字面值。知识图谱与 RDF 不完全等同，RDF 是可采用的表示标准之一。","example":"“小王—就读于—甲大学”和“甲大学—位于—上海”连在一起，就能顺着关系查小王学校所在的城市。","pitfall":"图里有一条记录，并不保证记录完整、最新或正确。","topic":"foundation","domainId":"d04","kind":"syllabus","conceptSources":[{"key":"rdf","record":"R32","category":"W3C 推荐标准","label":"RDF 1.1 · 三元组与图数据模型","url":"https://www.w3.org/TR/rdf11-concepts/#section-triples"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"rdf","record":"R32","category":"W3C 推荐标准","label":"RDF 1.1 · 三元组与图数据模型","url":"https://www.w3.org/TR/rdf11-concepts/#section-triples"}],"relatedQuestions":["OP12","OP32A","CQ-K030"]},{"id":"K031","domain":"知识图谱与计算机","unit":"专家系统与知识图谱","point":"本体知识表示","level":"掌握","page":3,"title":"本体与知识表示","summary":"本体对领域概念及其关系作形式化说明。","concept":"本体明确领域中的类、属性、个体和约束等，使知识具有共同且可解释的含义。OWL 用这些构件描述知识，并支持依据其形式语义进行推理。","example":"学校资料里统一规定“本科生属于学生”“课程可以有授课教师”。这是对概念关系的规定；“小王是本科生”则是一条具体事实。","pitfall":"本体偏重概念和约束，不是把全部学生姓名列成名单。","topic":"foundation","domainId":"d04","kind":"syllabus","conceptSources":[{"key":"owl","record":"R32","category":"W3C 推荐标准","label":"OWL 2 Primer · 类、属性、个体与约束","url":"https://www.w3.org/TR/owl2-primer/"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"owl","record":"R32","category":"W3C 推荐标准","label":"OWL 2 Primer · 类、属性、个体与约束","url":"https://www.w3.org/TR/owl2-primer/"}],"relatedQuestions":["CQ-K031"]},{"id":"K032","domain":"机器学习","unit":"机器学习基本概念","point":"无监督学习（聚类、特征降维）和有监督学习（分类、回归）的概念","level":"掌握","page":3,"title":"监督与无监督学习","summary":"监督学习用标签，无监督学习寻找数据结构。","concept":"监督学习根据输入和目标标签学习映射；分类预测类别，回归预测数值。无监督学习不使用这类目标标签，常见任务包括聚类和降维。","example":"已知过去每单的实际送达分钟数，可以学着预测新订单要多久，这是回归；只按订单特征把订单分组，没有给出正确组名，是聚类。","pitfall":"K-Means 是无监督聚类；逻辑回归虽然名字带“回归”，通常用于分类。","topic":"foundation","domainId":"d05","kind":"syllabus","conceptSources":[{"key":"ml","record":"R28","category":"官方技术文档","label":"scikit-learn · 拟合、预测与监督/无监督","url":"https://scikit-learn.org/stable/getting_started.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"ml","record":"R28","category":"官方技术文档","label":"scikit-learn · 拟合、预测与监督/无监督","url":"https://scikit-learn.org/stable/getting_started.html"}],"relatedQuestions":["OC08","CQ-K032"]},{"id":"K033","domain":"机器学习","unit":"机器学习基本概念","point":"数据预处理（含特征工程）","level":"掌握","page":3,"title":"数据预处理与特征工程","summary":"预处理整理数据，特征工程构造输入表示。","concept":"预处理包括处理缺失、重复、异常、尺度差异和类别编码等。特征工程把原始数据变成适合模型使用的特征。需要估计的变换参数应由训练集拟合，再用于验证集和测试集。","example":"比较商品时，价格有几百元，重量可能只有几千克。标准化可调整数值尺度，避免只因数字大就对某些距离计算影响过强。","pitfall":"先用全部数据计算均值或挑特征，再分测试集，可能让测试信息提前进入训练。","topic":"foundation","domainId":"d05","kind":"syllabus","conceptSources":[{"key":"preprocess","record":"R28","category":"官方技术文档","label":"scikit-learn · 数据预处理与标准化","url":"https://scikit-learn.org/stable/modules/preprocessing.html"},{"key":"leakage","record":"R28","category":"官方技术文档","label":"scikit-learn · 数据泄漏与训练集拟合","url":"https://scikit-learn.org/stable/common_pitfalls.html#data-leakage"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"preprocess","record":"R28","category":"官方技术文档","label":"scikit-learn · 数据预处理与标准化","url":"https://scikit-learn.org/stable/modules/preprocessing.html"},{"key":"leakage","record":"R28","category":"官方技术文档","label":"scikit-learn · 数据泄漏与训练集拟合","url":"https://scikit-learn.org/stable/common_pitfalls.html#data-leakage"}],"relatedQuestions":["OC11","OC12","CQ-K033","QA-03"]},{"id":"K034","domain":"机器学习","unit":"机器学习基本概念","point":"模型训练基本概念","level":"掌握","page":3,"title":"模型训练与数据划分","summary":"训练、验证和测试承担不同任务。","concept":"训练集用于学习参数，验证集用于选模型和调超参数，测试集用于独立评估。epoch 通常是遍历训练数据一轮，batch 是一次送入模型处理的一组样本。常见简单训练每个 batch 更新一次；梯度累积时可处理多个 batch 后才更新一次。","example":"做练习像训练，用模拟卷挑选复习方法像验证，最后保留一份没看过答案的试卷检查效果像测试。这个比方区分数据用途，不表示一个人做一道题就对应模型更新一次。","pitfall":"反复用测试集调参，会让测试结果变得过于乐观。","topic":"foundation","domainId":"d05","kind":"syllabus","conceptSources":[{"key":"overfit","record":"R27","category":"作者教材","label":"《动手学深度学习》4.4 · 训练、验证与泛化","url":"https://zh.d2l.ai/chapter_multilayer-perceptrons/underfit-overfit.html"},{"key":"leakage","record":"R28","category":"官方技术文档","label":"scikit-learn · 数据泄漏与训练集拟合","url":"https://scikit-learn.org/stable/common_pitfalls.html#data-leakage"},{"key":"autograd","record":"R60","category":"官方技术文档","label":"PyTorch 2.15 · eval 与梯度模式的区别","url":"https://docs.pytorch.org/docs/2.15/notes/autograd.html#locally-disabling-gradient-computation"},{"key":"accumulate","record":"R60","category":"官方技术文档","label":"PyTorch 2.15 · 多个 batch 的梯度累积","url":"https://docs.pytorch.org/docs/2.15/notes/amp_examples.html#gradient-accumulation"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"overfit","record":"R27","category":"作者教材","label":"《动手学深度学习》4.4 · 训练、验证与泛化","url":"https://zh.d2l.ai/chapter_multilayer-perceptrons/underfit-overfit.html"},{"key":"leakage","record":"R28","category":"官方技术文档","label":"scikit-learn · 数据泄漏与训练集拟合","url":"https://scikit-learn.org/stable/common_pitfalls.html#data-leakage"},{"key":"autograd","record":"R60","category":"官方技术文档","label":"PyTorch 2.15 · eval 与梯度模式的区别","url":"https://docs.pytorch.org/docs/2.15/notes/autograd.html#locally-disabling-gradient-computation"},{"key":"accumulate","record":"R60","category":"官方技术文档","label":"PyTorch 2.15 · 多个 batch 的梯度累积","url":"https://docs.pytorch.org/docs/2.15/notes/amp_examples.html#gradient-accumulation"}],"relatedQuestions":["CQ-K034","QA-03","QA-04","QA-08"]},{"id":"K035","domain":"机器学习","unit":"机器学习基本概念","point":"性能评估","level":"掌握","page":3,"title":"评估指标","summary":"精确率看查得准不准，召回率看找得全不全。","concept":"准确率＝预测正确数/样本数；精确率＝TP/(TP＋FP)；召回率＝TP/(TP＋FN)；F1＝2PR/(P＋R)。TP、FP、FN 是真正例、假正例、假负例，P、R 为精确率和召回率。MAE 是绝对误差均值，MSE 是平方误差均值。ROC-AUC 概括不同阈值下的分类排序表现，不能代替选定阈值的结果；分母为零时要说明处理约定。","example":"邮箱把 10 封邮件判成垃圾，其中 8 封确实是垃圾，精确率是 80%。实际共有 20 封垃圾邮件，只找出 8 封，召回率是 40%。","pitfall":"“判成垃圾的邮件”与“实际的垃圾邮件”是两个分母。类别很不均衡时，准确率高也可能漏掉大量少数类。","topic":"foundation","domainId":"d05","kind":"syllabus","conceptSources":[{"key":"evaluation","record":"R28","category":"官方技术文档","label":"scikit-learn · 分类及回归评价指标","url":"https://scikit-learn.org/stable/modules/model_evaluation.html#precision-recall-f-measure-metrics"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"evaluation","record":"R28","category":"官方技术文档","label":"scikit-learn · 分类及回归评价指标","url":"https://scikit-learn.org/stable/modules/model_evaluation.html#precision-recall-f-measure-metrics"}],"relatedQuestions":["CQ-K035","QA-06"]},{"id":"K036","domain":"机器学习","unit":"机器学习经典方法","point":"回归（如线性回归、逻辑回归）","level":"掌握","page":3,"title":"线性回归与逻辑回归","summary":"线性回归预测数值，逻辑回归常用于分类。","concept":"线性回归以特征的线性组合加截距作为预测值；二分类逻辑回归对线性得分应用 sigmoid（logistic）函数，得到类别概率估计，再按阈值分类。两者任务和常用损失不同，逻辑回归的概率估计也不保证已经校准。","example":"“这杯奶茶还要等几分钟”是数值预测；“会不会超过 20 分钟”是二分类。前者可考虑线性回归，后者可考虑逻辑回归。","pitfall":"逻辑回归通常用于分类，不能只凭名字把它当作普通数值回归。","topic":"foundation","domainId":"d05","kind":"syllabus","conceptSources":[{"key":"linear","record":"R28","category":"官方技术文档","label":"scikit-learn · 线性回归与逻辑回归","url":"https://scikit-learn.org/stable/modules/linear_model.html"},{"key":"calibration","record":"R63","category":"原始论文","label":"Guo 等 · 概率校准与正确率，ICML 2017","url":"https://proceedings.mlr.press/v70/guo17a.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"linear","record":"R28","category":"官方技术文档","label":"scikit-learn · 线性回归与逻辑回归","url":"https://scikit-learn.org/stable/modules/linear_model.html"},{"key":"calibration","record":"R63","category":"原始论文","label":"Guo 等 · 概率校准与正确率，ICML 2017","url":"https://proceedings.mlr.press/v70/guo17a.html"}],"relatedQuestions":["OC08","CQ-K036"]},{"id":"K037","domain":"机器学习","unit":"机器学习经典方法","point":"分类（如决策树、K近邻算法、支持向量机）","level":"掌握","page":3,"title":"决策树、KNN 与 SVM","summary":"决策树、KNN 和 SVM 用不同方式分类。","concept":"决策树根据特征条件递归划分数据；KNN 依据附近 K 个训练样本作预测；SVM 学习具有较大间隔的分类边界，核方法可用于非线性情况。","example":"判断一个水果是什么：决策树像依次问颜色、大小等条件；KNN 看它最像哪几个已标注水果；SVM 则在特征空间里寻找区分类别的边界。","pitfall":"KNN 的“近”由距离和特征尺度决定，不是天然固定；K 的选择也会影响结果。","topic":"foundation","domainId":"d05","kind":"syllabus","conceptSources":[{"key":"tree","record":"R28","category":"官方技术文档","label":"scikit-learn · 决策树","url":"https://scikit-learn.org/stable/modules/tree.html"},{"key":"knn","record":"R28","category":"官方技术文档","label":"scikit-learn · K 近邻分类","url":"https://scikit-learn.org/stable/modules/neighbors.html#nearest-neighbors-classification"},{"key":"svm","record":"R28","category":"官方技术文档","label":"scikit-learn · 支持向量机","url":"https://scikit-learn.org/stable/modules/svm.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"tree","record":"R28","category":"官方技术文档","label":"scikit-learn · 决策树","url":"https://scikit-learn.org/stable/modules/tree.html"},{"key":"knn","record":"R28","category":"官方技术文档","label":"scikit-learn · K 近邻分类","url":"https://scikit-learn.org/stable/modules/neighbors.html#nearest-neighbors-classification"},{"key":"svm","record":"R28","category":"官方技术文档","label":"scikit-learn · 支持向量机","url":"https://scikit-learn.org/stable/modules/svm.html"}],"relatedQuestions":["CQ-K037"]},{"id":"K038","domain":"机器学习","unit":"机器学习经典方法","point":"聚类（如K-Means聚类、层次聚类）","level":"掌握","page":3,"title":"K-Means 与层次聚类","summary":"聚类按相似性分组。","concept":"K-Means 以 K 个簇中心为基础，反复执行“将样本分配到最近中心”和“按簇内样本均值更新中心”，以减小簇内平方距离和。层次聚类通过逐步合并或拆分得到层次结构。","example":"把一堆水果按重量和大小分成三组，先不告诉算法哪种叫苹果、哪种叫橙子。分完的 1、2、3 组只是编号，还要看看各组里到底是什么。","pitfall":"簇编号不是现成的真实类别；K-Means 还会受到初始中心、尺度和异常点的影响。","topic":"foundation","domainId":"d05","kind":"syllabus","conceptSources":[{"key":"cluster","record":"R28","category":"官方技术文档","label":"scikit-learn · K-Means 与层次聚类","url":"https://scikit-learn.org/stable/modules/clustering.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"cluster","record":"R28","category":"官方技术文档","label":"scikit-learn · K-Means 与层次聚类","url":"https://scikit-learn.org/stable/modules/clustering.html"}],"relatedQuestions":["CQ-K038"]},{"id":"K039","domain":"机器学习","unit":"机器学习经典方法","point":"集成模型（如Boosting、随机森林）","level":"掌握","page":3,"title":"Boosting 与随机森林","summary":"集成学习组合多个模型的预测。","concept":"随机森林对样本和候选特征等作随机化，组合多棵决策树；分类可投票或平均类别概率，回归常取平均。scikit-learn 的分类实现平均概率。Boosting 逐步加入模型，针对当前组合的不足继续学习，不只是重复训练同一棵树。","example":"判断照片里的水果时，随机森林像让多棵树各自给意见再汇总；Boosting 像先看上一轮哪些样本没做好，再训练下一轮重点改进。","pitfall":"随机森林和 Boosting 的训练方式不同；模型多也不保证一定更准。","topic":"foundation","domainId":"d05","kind":"syllabus","conceptSources":[{"key":"ensemble","record":"R28","category":"官方技术文档","label":"scikit-learn · 随机森林与 Boosting","url":"https://scikit-learn.org/stable/modules/ensemble.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"ensemble","record":"R28","category":"官方技术文档","label":"scikit-learn · 随机森林与 Boosting","url":"https://scikit-learn.org/stable/modules/ensemble.html"}],"relatedQuestions":["CQ-K039"]},{"id":"K040","domain":"机器学习","unit":"机器学习经典方法","point":"降维（如PCA、LDA）","level":"理解","page":3,"title":"PCA 与线性判别分析","summary":"PCA 不用类别标签，LDA 使用类别标签。","concept":"PCA 寻找使投影数据方差尽可能大的正交方向，属于无监督降维。线性判别分析 LDA 利用类别标签，寻找有利于区分类别的线性投影，也可用于分类。这里的 LDA 不是主题模型。","example":"记录水果的重量、长度、宽度等十项数据，想用两三个数概括，可以考虑 PCA；若已有水果类别，并希望投影后类别更容易分开，可考虑 LDA。","pitfall":"方差最大的方向不一定最能区分类别；PCA 没有利用类别标签。","topic":"foundation","domainId":"d05","kind":"syllabus","conceptSources":[{"key":"pca","record":"R28","category":"官方技术文档","label":"scikit-learn · PCA","url":"https://scikit-learn.org/stable/modules/decomposition.html#pca"},{"key":"lda","record":"R28","category":"官方技术文档","label":"scikit-learn · 线性判别分析与降维","url":"https://scikit-learn.org/stable/modules/lda_qda.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"pca","record":"R28","category":"官方技术文档","label":"scikit-learn · PCA","url":"https://scikit-learn.org/stable/modules/decomposition.html#pca"},{"key":"lda","record":"R28","category":"官方技术文档","label":"scikit-learn · 线性判别分析与降维","url":"https://scikit-learn.org/stable/modules/lda_qda.html"}],"relatedQuestions":["CQ-K040"]},{"id":"K041","domain":"机器学习","unit":"机器学习经典方法","point":"朴素贝叶斯","level":"知道","page":3,"title":"朴素贝叶斯","summary":"朴素贝叶斯在给定类别后假设特征条件独立。","concept":"朴素贝叶斯分类器基于贝叶斯定理，用类别先验和特征在该类别下的似然计算后验，并作分类。“朴素”指给定类别时，特征之间条件独立的假设。","example":"邮件里出现“中奖”“领奖”等词，模型据这些词在垃圾邮件和正常邮件中的统计情况，估计邮件属于哪一类。","pitfall":"不是假设所有词在任何情况下都互不相关；条件独立是模型采用的简化假设。","topic":"foundation","domainId":"d05","kind":"syllabus","conceptSources":[{"key":"bayes","record":"R28","category":"官方技术文档","label":"scikit-learn · 朴素贝叶斯的条件独立假设","url":"https://scikit-learn.org/stable/modules/naive_bayes.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 3 页","url":"41/41.pdf#page=3"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"bayes","record":"R28","category":"官方技术文档","label":"scikit-learn · 朴素贝叶斯的条件独立假设","url":"https://scikit-learn.org/stable/modules/naive_bayes.html"}],"relatedQuestions":["CQ-K041"]},{"id":"K042","domain":"机器学习","unit":"强化学习基本概念","point":"强化学习定义及原理","level":"掌握","page":4,"title":"强化学习","summary":"强化学习通过奖励学习行动策略。","concept":"强化学习中，智能体与环境交互，观察状态、选择动作并收到奖励，目标通常是最大化预期累计回报。策略规定怎样选动作；探索尝试新动作，利用选择当前认为较好的动作。","example":"训练一个游戏角色走迷宫：到终点有奖励，撞墙有惩罚。角色要学会走到终点，不能只盯着眼前一步的得分。","pitfall":"即时奖励和长期回报不同，奖励规则设计不好也可能学出投机行为。","topic":"foundation","domainId":"d05","kind":"syllabus","conceptSources":[{"key":"rl","record":"R35","category":"作者机构技术文档","label":"Spinning Up · 状态、策略、回报和价值函数","url":"https://spinningup.openai.com/en/latest/spinningup/rl_intro.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"rl","record":"R35","category":"作者机构技术文档","label":"Spinning Up · 状态、策略、回报和价值函数","url":"https://spinningup.openai.com/en/latest/spinningup/rl_intro.html"}],"relatedQuestions":["OT02","OT04","CQ-K042"]},{"id":"K043","domain":"机器学习","unit":"强化学习基本概念","point":"价值函数与Q学习","level":"理解","page":4,"title":"价值函数与 Q 学习","summary":"价值函数估计未来累计回报。","concept":"在策略 π 下，Vπ(s) 是从 s 开始的预期回报，Qπ(s,a) 是先采取 a、之后按 π 行动的预期回报。表格型 Q 学习按 Q←Q＋α[r＋γ max Q(s′,a′)−Q] 更新，α 是学习率，γ 是折扣因子，目标是学习最优动作价值；下一状态终止时不加后续价值。","example":"走迷宫时，同一格向左可能绕远，向右可能更快到终点。Q 值比较的是从这一步开始的后续收益，不只是这一步有没有得分。","pitfall":"Q 值是估计值，不是已经发生的即时奖励；还要看折扣、策略和学习是否充分。","topic":"foundation","domainId":"d05","kind":"syllabus","conceptSources":[{"key":"rl","record":"R35","category":"作者机构技术文档","label":"Spinning Up · 状态、策略、回报和价值函数","url":"https://spinningup.openai.com/en/latest/spinningup/rl_intro.html"},{"key":"qlearning","record":"R35","category":"作者原文","label":"Barto 与 Mahadevan · Q-learning 更新，式8","url":"https://incompleteideas.net/rlai.cs.ualberta.ca/papers/barto03recent.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"rl","record":"R35","category":"作者机构技术文档","label":"Spinning Up · 状态、策略、回报和价值函数","url":"https://spinningup.openai.com/en/latest/spinningup/rl_intro.html"},{"key":"qlearning","record":"R35","category":"作者原文","label":"Barto 与 Mahadevan · Q-learning 更新，式8","url":"https://incompleteideas.net/rlai.cs.ualberta.ca/papers/barto03recent.pdf"}],"relatedQuestions":["OT04","CQ-K043","QA-07"]},{"id":"K044","domain":"深度学习","unit":"神经网络基本概念","point":"前向传播与反向传播","level":"掌握","page":4,"title":"前向与反向传播","summary":"前向传播算输出，反向传播算梯度。","concept":"前向传播按计算顺序从输入得到各层输出及损失；反向传播沿计算图逆序用链式法则计算梯度；优化器根据梯度更新参数。PyTorch 默认累积梯度，常见简单循环会在每个 batch 反向前清零；有意累积时则按更新周期安排清零。","example":"模型把一张“3”的照片看成“8”：前向传播得到预测，损失衡量偏差，反向传播计算参数对损失的影响，再由优化器调整参数。","pitfall":"loss.backward() 计算梯度，optimizer.step() 才执行参数更新，两者不是同一步。","topic":"model","domainId":"d06","kind":"syllabus","conceptSources":[{"key":"backprop","record":"R27","category":"作者教材","label":"《动手学深度学习》4.7 · 前向与反向传播","url":"https://zh.d2l.ai/chapter_multilayer-perceptrons/backprop.html"},{"key":"pytorch","record":"R07","category":"官方技术文档","label":"PyTorch · 训练循环、梯度与优化器","url":"https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial"},{"key":"autograd","record":"R60","category":"官方技术文档","label":"PyTorch 2.15 · eval 与梯度模式的区别","url":"https://docs.pytorch.org/docs/2.15/notes/autograd.html#locally-disabling-gradient-computation"},{"key":"accumulate","record":"R60","category":"官方技术文档","label":"PyTorch 2.15 · 多个 batch 的梯度累积","url":"https://docs.pytorch.org/docs/2.15/notes/amp_examples.html#gradient-accumulation"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"backprop","record":"R27","category":"作者教材","label":"《动手学深度学习》4.7 · 前向与反向传播","url":"https://zh.d2l.ai/chapter_multilayer-perceptrons/backprop.html"},{"key":"pytorch","record":"R07","category":"官方技术文档","label":"PyTorch · 训练循环、梯度与优化器","url":"https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial"},{"key":"autograd","record":"R60","category":"官方技术文档","label":"PyTorch 2.15 · eval 与梯度模式的区别","url":"https://docs.pytorch.org/docs/2.15/notes/autograd.html#locally-disabling-gradient-computation"},{"key":"accumulate","record":"R60","category":"官方技术文档","label":"PyTorch 2.15 · 多个 batch 的梯度累积","url":"https://docs.pytorch.org/docs/2.15/notes/amp_examples.html#gradient-accumulation"}],"relatedQuestions":["OT15","OB4","CQ-K044","QA-04"]},{"id":"K045","domain":"深度学习","unit":"神经网络基本概念","point":"激活函数","level":"掌握","page":4,"title":"激活函数","summary":"激活函数对神经网络单元施加变换。","concept":"常见非线性激活有 ReLU(x)＝max(0,x)、sigmoid 和 tanh。sigmoid 的值在 0 与 1 之间，tanh 的值在 −1 与 1 之间。非线性激活使网络能表示单纯线性层堆叠无法表示的关系。","example":"把 −2、0、3 输入 ReLU，输出分别为 0、0、3。它保留正数，把负数变成 0；这就是这个函数的具体运算。","pitfall":"激活函数和损失函数用途不同；很多纯线性层连起来仍然是线性变换。","topic":"model","domainId":"d06","kind":"syllabus","conceptSources":[{"key":"mlp","record":"R27","category":"作者教材","label":"《动手学深度学习》4.1 · 多层感知机与激活","url":"https://zh.d2l.ai/chapter_multilayer-perceptrons/mlp.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"mlp","record":"R27","category":"作者教材","label":"《动手学深度学习》4.1 · 多层感知机与激活","url":"https://zh.d2l.ai/chapter_multilayer-perceptrons/mlp.html"}],"relatedQuestions":["CQ-K045"]},{"id":"K046","domain":"深度学习","unit":"神经网络基本概念","point":"损失函数","level":"掌握","page":4,"title":"损失函数","summary":"损失函数衡量预测与目标的差异。","concept":"训练通过最小化损失来学习参数。回归常用平方误差或绝对误差，分类常用交叉熵。PyTorch 的 CrossEntropyLoss 通常直接接收未做 softmax 的 logits；标签格式需与接口约定匹配。","example":"预测奶茶还要等 8 分钟，实际等了 10 分钟：绝对误差是 2，平方误差是 4。误差怎样变成损失，取决于选用的函数。","pitfall":"训练损失下降，不代表测试表现或所有实际指标都会改善。","topic":"model","domainId":"d06","kind":"syllabus","conceptSources":[{"key":"pytorch","record":"R07","category":"官方技术文档","label":"PyTorch · 训练循环、梯度与优化器","url":"https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial"},{"key":"crossentropy","record":"R45","category":"官方技术文档","label":"PyTorch · CrossEntropyLoss 的 logits 输入","url":"https://docs.pytorch.org/docs/2.15/generated/torch.nn.CrossEntropyLoss.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"pytorch","record":"R07","category":"官方技术文档","label":"PyTorch · 训练循环、梯度与优化器","url":"https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial"},{"key":"crossentropy","record":"R45","category":"官方技术文档","label":"PyTorch · CrossEntropyLoss 的 logits 输入","url":"https://docs.pytorch.org/docs/2.15/generated/torch.nn.CrossEntropyLoss.html"}],"relatedQuestions":["CQ-K046"]},{"id":"K047","domain":"深度学习","unit":"神经网络基本概念","point":"梯度下降法","level":"掌握","page":4,"title":"梯度下降","summary":"梯度下降沿负梯度更新参数。","concept":"对可微损失，梯度下降按 θ←θ−η∇L 更新参数。批量梯度下降使用全部训练数据，小批量方法使用其中一批。学习率 η 决定更新步长；不同变体对梯度估计和步长处理不同。","example":"下坡时，步子太大可能跨过低处、在两边来回；步子太小则走得慢。学习率也有类似影响，但模型优化发生在参数空间里。","pitfall":"梯度为零可能对应局部极值或鞍点，不能直接证明全局最优。","topic":"model","domainId":"d06","kind":"syllabus","conceptSources":[{"key":"pytorch","record":"R07","category":"官方技术文档","label":"PyTorch · 训练循环、梯度与优化器","url":"https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"pytorch","record":"R07","category":"官方技术文档","label":"PyTorch · 训练循环、梯度与优化器","url":"https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial"}],"relatedQuestions":["CQ-K047"]},{"id":"K048","domain":"深度学习","unit":"神经网络基本概念","point":"过拟合与欠拟合","level":"理解","page":4,"title":"过拟合与欠拟合","summary":"过拟合是训练表现好而泛化不足。","concept":"过拟合时，模型适应了训练数据中的细节甚至噪声，未见数据上的误差较大；欠拟合时，模型未充分学到数据规律，训练误差也较大。通常结合训练集和验证集表现来判断。","example":"做过的练习题全会，一换数字就不会，有点像过拟合；原题和新题都做不好，更像欠拟合。这只是帮助区分的比方。","pitfall":"只看训练分数无法判断泛化；验证差还可能由分布变化等原因造成。","topic":"model","domainId":"d06","kind":"syllabus","conceptSources":[{"key":"overfit","record":"R27","category":"作者教材","label":"《动手学深度学习》4.4 · 训练、验证与泛化","url":"https://zh.d2l.ai/chapter_multilayer-perceptrons/underfit-overfit.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"overfit","record":"R27","category":"作者教材","label":"《动手学深度学习》4.4 · 训练、验证与泛化","url":"https://zh.d2l.ai/chapter_multilayer-perceptrons/underfit-overfit.html"}],"relatedQuestions":["CQ-K048"]},{"id":"K049","domain":"深度学习","unit":"神经网络基本概念","point":"正则化","level":"理解","page":4,"title":"正则化","summary":"正则化通过限制学习过程改善泛化。","concept":"正则化用于降低过拟合。L1 惩罚参数绝对值之和，L2 常惩罚参数平方和；Dropout 在训练时随机将部分单元输出置零；早停根据验证表现停止训练。它们机制不同，不能把“加惩罚”“丢弃单元”和“提前停”当成同一操作。","example":"拟合每天的气温时，不必为了穿过每一个观测点画出剧烈弯折的曲线。适当限制复杂度，可能更接近可重复的规律。","pitfall":"正则化太强也会欠拟合。Dropout 在训练和推理时的行为不同。","topic":"model","domainId":"d06","kind":"syllabus","conceptSources":[{"key":"overfit","record":"R27","category":"作者教材","label":"《动手学深度学习》4.4 · 训练、验证与泛化","url":"https://zh.d2l.ai/chapter_multilayer-perceptrons/underfit-overfit.html"},{"key":"dropout","record":"R27","category":"作者教材","label":"《动手学深度学习》4.6 · Dropout","url":"https://zh.d2l.ai/chapter_multilayer-perceptrons/dropout.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"overfit","record":"R27","category":"作者教材","label":"《动手学深度学习》4.4 · 训练、验证与泛化","url":"https://zh.d2l.ai/chapter_multilayer-perceptrons/underfit-overfit.html"},{"key":"dropout","record":"R27","category":"作者教材","label":"《动手学深度学习》4.6 · Dropout","url":"https://zh.d2l.ai/chapter_multilayer-perceptrons/dropout.html"}],"relatedQuestions":["CQ-K049"]},{"id":"K050","domain":"深度学习","unit":"典型神经网络","point":"序贯模型（Sequential）","level":"掌握","page":4,"title":"Sequential 模型","summary":"Sequential 按顺序串联模块。","concept":"PyTorch 的 nn.Sequential 将模块按给定顺序连接，前一模块的输出传给后一模块。适合简单串联结构；需要多分支、跳连或复杂控制时，可自定义 forward。","example":"先把水果照片转为特征向量，再用“Linear→ReLU→Linear”作分类，各模块依次接收上一模块的输出，适合 nn.Sequential。这里串联的是网络模块，不是把读文件、训练、保存等外部步骤都叫 Sequential 模型。","pitfall":"Sequential 不专指时间序列模型；能否使用取决于网络连接方式。","topic":"model","domainId":"d06","kind":"syllabus","conceptSources":[{"key":"sequential","record":"R45","category":"官方技术文档","label":"PyTorch · nn.Sequential 串联模块","url":"https://docs.pytorch.org/docs/2.15/generated/torch.nn.Sequential.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"sequential","record":"R45","category":"官方技术文档","label":"PyTorch · nn.Sequential 串联模块","url":"https://docs.pytorch.org/docs/2.15/generated/torch.nn.Sequential.html"}],"relatedQuestions":["CQ-K050"]},{"id":"K051","domain":"深度学习","unit":"典型神经网络","point":"CNN特点及经典模型（LeNet、ResNet）","level":"掌握","page":4,"title":"卷积神经网络 CNN","summary":"CNN 通过卷积提取局部模式。","concept":"CNN 通过局部连接和参数共享处理空间结构；池化常缩小特征图。LeNet 是早期经典 CNN，包含卷积、池化和分类等层。ResNet 用残差连接，把分支 F(x) 与捷径 x 相加；维度不同时可用投影适配，帮助深层网络优化。","example":"看一张猫的照片时，局部区域可能出现耳朵、边缘和纹理。卷积核在不同位置使用同一组参数，提取相似的局部模式。","pitfall":"池化不是激活函数；残差连接也不意味着不需要训练。","topic":"model","domainId":"d06","kind":"syllabus","conceptSources":[{"key":"conv","record":"R27","category":"作者教材","label":"《动手学深度学习》6.1 · 卷积的局部性与参数共享","url":"https://zh.d2l.ai/chapter_convolutional-neural-networks/why-conv.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"conv","record":"R27","category":"作者教材","label":"《动手学深度学习》6.1 · 卷积的局部性与参数共享","url":"https://zh.d2l.ai/chapter_convolutional-neural-networks/why-conv.html"}],"relatedQuestions":["OC15","CQ-K051"]},{"id":"K052","domain":"深度学习","unit":"典型神经网络","point":"RNN特点及经典模型等（LSTM，GRU）","level":"掌握","page":4,"title":"RNN、LSTM 与 GRU","summary":"RNN 用循环状态处理序列。","concept":"循环神经网络根据当前输入和上一时刻状态计算新状态。LSTM 用门和记忆单元控制信息保留，GRU 用更新门与重置门等机制调节状态，二者都用于缓解普通 RNN 的长程依赖困难。","example":"读“我把钥匙忘在……”时，前面读过的词会影响对后面内容的判断。RNN 用状态传递这些历史信息。","pitfall":"LSTM、GRU 能缓解部分困难，但不能保证记住任意长序列的全部信息。","topic":"model","domainId":"d06","kind":"syllabus","conceptSources":[{"key":"rnn","record":"R27","category":"作者教材","label":"《动手学深度学习》8.4 · 循环神经网络","url":"https://zh.d2l.ai/chapter_recurrent-neural-networks/rnn.html"},{"key":"lstm","record":"R27","category":"作者教材","label":"《动手学深度学习》9.2 · LSTM","url":"https://zh.d2l.ai/chapter_recurrent-modern/lstm.html"},{"key":"gru","record":"R27","category":"作者教材","label":"《动手学深度学习》9.1 · GRU","url":"https://zh.d2l.ai/chapter_recurrent-modern/gru.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"rnn","record":"R27","category":"作者教材","label":"《动手学深度学习》8.4 · 循环神经网络","url":"https://zh.d2l.ai/chapter_recurrent-neural-networks/rnn.html"},{"key":"lstm","record":"R27","category":"作者教材","label":"《动手学深度学习》9.2 · LSTM","url":"https://zh.d2l.ai/chapter_recurrent-modern/lstm.html"},{"key":"gru","record":"R27","category":"作者教材","label":"《动手学深度学习》9.1 · GRU","url":"https://zh.d2l.ai/chapter_recurrent-modern/gru.html"}],"relatedQuestions":["OT11","CQ-K052"]},{"id":"K053","domain":"深度学习","unit":"典型神经网络","point":"Transformer","level":"理解","page":4,"title":"Transformer 的核心模块","summary":"Transformer 以注意力机制为核心。","concept":"Transformer 由注意力、逐位置前馈网络、残差连接和归一化等模块构成，并加入位置信息。自注意力关联同一序列中的不同位置；自回归解码器用因果掩码阻止看到未来位置。","example":"读“小王把伞递给小李，因为他没带伞”，理解“他”指谁要联系前文。注意力为不同位置建立联系，但不保证一定消除句子歧义。","pitfall":"生成下一个 token 时不能看尚未生成的后文；因果掩码和补齐掩码作用不同。","topic":"model","domainId":"d06","kind":"syllabus","conceptSources":[{"key":"transformer","record":"R27","category":"作者教材","label":"《动手学深度学习》10.7 · Transformer","url":"https://zh.d2l.ai/chapter_attention-mechanisms/transformer.html"},{"key":"pretrain","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第7章 Transformer 与预训练","url":"https://web.stanford.edu/~jurafsky/slp3/7.pdf"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"transformer","record":"R27","category":"作者教材","label":"《动手学深度学习》10.7 · Transformer","url":"https://zh.d2l.ai/chapter_attention-mechanisms/transformer.html"},{"key":"pretrain","record":"R33","category":"作者教材","label":"Jurafsky 与 Martin · 第7章 Transformer 与预训练","url":"https://web.stanford.edu/~jurafsky/slp3/7.pdf"}],"relatedQuestions":["OM05","CQ-K053"]},{"id":"K054","domain":"计算机视觉","unit":"计算机视觉基础","point":"特征表示与滤波","level":"理解","page":4,"title":"图像特征与滤波","summary":"图像特征描述图像中的可用信息。","concept":"图像特征可描述颜色、形状、边缘、纹理等，也可由神经网络学习。滤波用邻域运算处理图像；平滑常用于抑制噪声，锐化强调变化和细节。","example":"拍作业时画面上有零星小噪点，平滑可能让它们变弱；但处理太强，也可能把细小笔画一起弄模糊。","pitfall":"颜色不是唯一图像特征；滤波也不是越强越好。","topic":"vision","domainId":"d07","kind":"syllabus","conceptSources":[{"key":"filter","record":"R34","category":"官方技术文档","label":"OpenCV 4.12 · 图像平滑与滤波","url":"https://docs.opencv.org/4.12.0/d4/d13/tutorial_py_filtering.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"filter","record":"R34","category":"官方技术文档","label":"OpenCV 4.12 · 图像平滑与滤波","url":"https://docs.opencv.org/4.12.0/d4/d13/tutorial_py_filtering.html"}],"relatedQuestions":["OB5","CQ-K054"]},{"id":"K055","domain":"计算机视觉","unit":"计算机视觉基础","point":"边缘检测与局部特征描述符","level":"理解","page":4,"title":"边缘与局部描述符","summary":"边缘和局部描述符用于提取、匹配图像结构。","concept":"边缘检测寻找亮度等变化显著的位置，常见方法有 Sobel、Canny。局部描述符把关键点邻域表示为数值，用于匹配，例如 SIFT 描述符。边缘可能来自轮廓、阴影或纹理；“检测关键点”和“描述关键点”是相关但不同的步骤。","example":"给同一本书从两个角度各拍一张照片，可用封面上的局部特征去匹配，判断照片里是不是同一本书。","pitfall":"桌上的影子也会形成边缘；检测到边缘不等于找到独立物体的完整边界。","topic":"vision","domainId":"d07","kind":"syllabus","conceptSources":[{"key":"edge","record":"R34","category":"官方技术文档","label":"OpenCV 4.10 · Canny 边缘检测","url":"https://docs.opencv.org/4.10.0/da/d22/tutorial_py_canny.html"},{"key":"sift","record":"R62","category":"官方技术文档","label":"OpenCV 4.12 · SIFT 关键点与描述符","url":"https://docs.opencv.org/4.12.0/da/df5/tutorial_py_sift_intro.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"edge","record":"R34","category":"官方技术文档","label":"OpenCV 4.10 · Canny 边缘检测","url":"https://docs.opencv.org/4.10.0/da/d22/tutorial_py_canny.html"},{"key":"sift","record":"R62","category":"官方技术文档","label":"OpenCV 4.12 · SIFT 关键点与描述符","url":"https://docs.opencv.org/4.12.0/da/df5/tutorial_py_sift_intro.html"}],"relatedQuestions":["CQ-K055"]},{"id":"K056","domain":"计算机视觉","unit":"计算机视觉应用","point":"图像分割与分类","level":"掌握","page":4,"title":"分类与分割","summary":"分类给整图标签，分割给像素标签。","concept":"图像分类为整张图像预测类别；语义分割为像素预测所属类别；实例分割在此基础上区分同一类别的不同对象。三者输出粒度不同。","example":"一张照片里有两只猫：分类回答“有猫”，语义分割标出猫的像素，实例分割还要分清哪片像素属于第一只、哪片属于第二只。","pitfall":"整图标签不包含准确位置；语义分割也不一定区分同类对象的个体。","topic":"vision","domainId":"d07","kind":"syllabus","conceptSources":[{"key":"detection","record":"R27","category":"作者教材","label":"《动手学深度学习》13.3 · 目标检测和边界框","url":"https://zh.d2l.ai/chapter_computer-vision/bounding-box.html"},{"key":"segmentation","record":"R27","category":"作者教材","label":"《动手学深度学习》13.9 · 像素类别与实例区分","url":"https://zh.d2l.ai/chapter_computer-vision/semantic-segmentation-and-dataset.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"detection","record":"R27","category":"作者教材","label":"《动手学深度学习》13.3 · 目标检测和边界框","url":"https://zh.d2l.ai/chapter_computer-vision/bounding-box.html"},{"key":"segmentation","record":"R27","category":"作者教材","label":"《动手学深度学习》13.9 · 像素类别与实例区分","url":"https://zh.d2l.ai/chapter_computer-vision/semantic-segmentation-and-dataset.html"}],"relatedQuestions":["CQ-K056"]},{"id":"K057","domain":"计算机视觉","unit":"计算机视觉应用","point":"目标检测与识别","level":"掌握","page":4,"title":"目标检测与识别","summary":"目标检测预测目标类别和位置。","concept":"目标检测通常为图像中的多个目标输出边界框、类别和置信度。与整图分类相比，它还需要定位；检测效果常结合框的重叠程度和检出情况评估。","example":"拍一张餐桌照片，系统框出杯子和盘子，并分别标名字，就是目标检测。只说“这是一张餐桌照片”没有完成检测。","pitfall":"置信度不是事实保证；分类正确也不能证明框的位置准确。","topic":"vision","domainId":"d07","kind":"syllabus","conceptSources":[{"key":"detection","record":"R27","category":"作者教材","label":"《动手学深度学习》13.3 · 目标检测和边界框","url":"https://zh.d2l.ai/chapter_computer-vision/bounding-box.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"detection","record":"R27","category":"作者教材","label":"《动手学深度学习》13.3 · 目标检测和边界框","url":"https://zh.d2l.ai/chapter_computer-vision/bounding-box.html"}],"relatedQuestions":["OC04","OB5","CQ-K057"]},{"id":"K058","domain":"计算机视觉","unit":"计算机视觉应用","point":"生物特征识别","level":"理解","page":4,"title":"生物特征识别","summary":"生物识别利用生理或行为特征区分身份。","concept":"常见特征有人脸、指纹、虹膜和声纹。验证通常是一对一比较，判断是否为声称的身份；识别通常是一对多查找，判断属于候选库中的谁。阈值会影响误接受与误拒绝。","example":"手机解锁时，系统比较当前人脸和已登记人脸，属于身份验证。不是只要照片看着像本人，就一定能通过。","pitfall":"相似度不是身份证明的绝对保证；采集和保存生物特征还涉及隐私保护。","topic":"vision","domainId":"d07","kind":"syllabus","conceptSources":[{"key":"biometric","record":"R44","category":"技术规范","label":"NIST SP 800-63B-4 · §3.2.3 生物特征使用边界","url":"https://pages.nist.gov/800-63-4/sp800-63b.html#biometric_use"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"biometric","record":"R44","category":"技术规范","label":"NIST SP 800-63B-4 · §3.2.3 生物特征使用边界","url":"https://pages.nist.gov/800-63-4/sp800-63b.html#biometric_use"}],"relatedQuestions":["CQ-K058"]},{"id":"K059","domain":"计算机视觉","unit":"计算机视觉应用","point":"行为分析","level":"知道","page":4,"title":"行为分析","summary":"行为分析关注动作及其时间变化。","concept":"视觉行为分析可利用图像或视频中的外观、位置、姿态和时间变化识别动作。目标跟踪关联不同时刻的同一目标，动作识别判断行为类别；复杂动态通常需要时序信息，但不能说所有动作都必须靠视频识别。","example":"同一个人看起来蹲得很低，可能在捡东西，也可能刚跌倒。连续画面中的动作变化通常更有帮助，但即使有视频也未必能确定真实意图，不能说“看了视频就一定分得清”。","pitfall":"识别动作不等于知道真实动机；检测到人也不等于已经识别了行为。","topic":"vision","domainId":"d07","kind":"syllabus","conceptSources":[],"conceptKind":"scope","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"relatedQuestions":["CQ-K059"]},{"id":"K060","domain":"计算机视觉","unit":"计算机视觉应用","point":"三维重建与立体视觉","level":"知道","page":4,"title":"三维重建与立体视觉","summary":"立体视觉和三维重建估计空间结构。","concept":"立体视觉利用不同视点图像的对应关系与相机几何估计深度；三维重建从图像、深度等数据恢复物体或场景的三维结构。结果依赖标定、匹配和建模条件。","example":"左右眼看到的画面略有差别，帮助人判断远近。双目相机也利用两幅图中的视差估计深度，但需要已知或估计相机参数。","pitfall":"一张二维照片通常不能唯一确定完整三维场景，背面信息也可能根本没有拍到。","topic":"vision","domainId":"d07","kind":"syllabus","conceptSources":[{"key":"stereo","record":"R34","category":"官方技术文档","label":"OpenCV 4.12 · 视差与深度","url":"https://docs.opencv.org/4.12.0/dd/d53/tutorial_py_depthmap.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"}],"sources":[{"label":"本地大纲 · PDF 第 4 页","url":"41/41.pdf#page=4"},{"label":"考试院大纲入口","url":"https://scite.shmeea.edu.cn/home/Syllabus"},{"key":"stereo","record":"R34","category":"官方技术文档","label":"OpenCV 4.12 · 视差与深度","url":"https://docs.opencv.org/4.12.0/dd/d53/tutorial_py_depthmap.html"}],"relatedQuestions":["CQ-K060"]},{"id":"K061","domain":"计算机视觉","unit":"计算机视觉应用","point":"图像生成与风格迁移","level":"知道","page":4,"title":"图像生成与风格迁移","summary":"图像生成合成图像，风格迁移改变表现风格。","concept":"图像生成根据学习到的数据分布合成图像，可由文字或图像等条件控制，也可以无这类条件。风格迁移在保留一定内容结构的同时改变纹理、色彩等风格特征；二者与图像识别的目标不同。","example":"把自己的街景照片变成水彩画效果，是风格迁移；根据“一只猫坐在窗边”的文字生成新图片，是条件图像生成。","pitfall":"生成得像照片，不代表这件事真实发生过。","topic":"vision","domainId":"d07","kind":"syllabus","conceptSources":[{"key":"style","record":"R27","category":"作者教材","label":"《动手学深度学习》13.12 · 内容与风格","url":"https://zh.d2l.ai/chapter_computer-vision/neural-style.html"}],"conceptKind":"definition","scopeSources":[{"label":"本地大纲 · PDF 第 4 页","url":"41
